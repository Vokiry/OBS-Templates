name: Package Portable Windows Release

'on':
  push:
    branches:
      - unstable
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-portable-windows:
    name: Build Standalone Windows Portable (.zip)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build_staging\SYSTEM-OBS-Templates-Portable\python"
          New-Item -ItemType Directory -Force -Path "dist"

      - name: Download and configure Embedded Python 3.12
        shell: pwsh
        run: |
          $embedUrl = "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip"
          $zipPath = "$env:TEMP\python-3.12-embed.zip"
          $pythonTarget = "build_staging\SYSTEM-OBS-Templates-Portable\python"

          Write-Host "[+] Downloading embedded Python from $embedUrl..."
          Invoke-WebRequest -Uri $embedUrl -OutFile $zipPath

          Write-Host "[+] Extracting embedded Python to $pythonTarget..."
          Expand-Archive -Path $zipPath -DestinationPath $pythonTarget -Force
          Remove-Item -Force $zipPath

          # Configure python312._pth to enable site-packages and standard imports
          $pthFile = Get-ChildItem -Path $pythonTarget -Filter "python*._pth" | Select-Object -First 1
          if ($pthFile) {
              Write-Host "[+] Configuring $($pthFile.FullName) to enable site-packages..."
              $lines = Get-Content $pthFile.FullName
              $newLines = @()
              foreach ($line in $lines) {
                  if ($line -match "^#\s*import site") {
                      $newLines += "Lib\site-packages"
                      $newLines += "import site"
                  } else {
                      $newLines += $line
                  }
              }
              Set-Content -Path $pthFile.FullName -Value $newLines
          }

          # Bootstrap pip inside embedded Python
          $getPipUrl = "https://bootstrap.pypa.io/get-pip.py"
          $getPipPath = "$env:TEMP\get-pip.py"
          Write-Host "[+] Downloading get-pip.py..."
          Invoke-WebRequest -Uri $getPipUrl -OutFile $getPipPath

          $pyExe = Join-Path $pythonTarget "python.exe"
          Write-Host "[+] Installing pip into embedded Python..."
          & $pyExe $getPipPath --no-warn-script-location

          # Install project requirements into embedded Python
          Write-Host "[+] Installing project requirements from bridge/requirements.txt..."
          & $pyExe -m pip install --no-warn-script-location -r bridge/requirements.txt

          # Cleanup unnecessary files to keep zip lightweight
          Write-Host "[+] Cleaning up pip cache and temporary files..."
          Remove-Item -Force -ErrorAction SilentlyContinue $getPipPath
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $pythonTarget "Scripts")
          Get-ChildItem -Path $pythonTarget -Include "__pycache__", "*.pyc" -Recurse | Remove-Item -Force -Recurse

      - name: Copy project files to staging
        shell: pwsh
        run: |
          $dest = "build_staging\SYSTEM-OBS-Templates-Portable"

          # Copy overlays and OBS scenes
          Copy-Item -Path "src" -Destination "$dest\src" -Recurse
          Copy-Item -Path "obs" -Destination "$dest\obs" -Recurse

          # Copy bridge backend (excluding venv, caches, tokens)
          New-Item -ItemType Directory -Force -Path "$dest\bridge"
          Get-ChildItem -Path "bridge" -Exclude ".venv", "__pycache__", ".pytest_cache", "*.token.json", "*.bak" | Copy-Item -Destination "$dest\bridge" -Recurse

          # Copy launch scripts and metadata
          Copy-Item "start.bat" "$dest\"
          Copy-Item "settings.bat" "$dest\"
          Copy-Item "start.sh" "$dest\"
          Copy-Item "settings.sh" "$dest\"
          Copy-Item "README.md" "$dest\"
          Copy-Item "LICENSE" "$dest\"
          if (Test-Path "pytest.ini") { Copy-Item "pytest.ini" "$dest\" }

          # Ensure bridge/config.toml exists from example if not already present
          if (-not (Test-Path "$dest\bridge\config.toml")) {
              Copy-Item "bridge\config.example.toml" "$dest\bridge\config.toml"
          }

      - name: Verify embedded Python environment
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $pyExe = "build_staging\SYSTEM-OBS-Templates-Portable\python\python.exe"
          Write-Host "[*] Verifying embedded Python runtime and imports..."
          & $pyExe -c "import aiohttp, websockets, twitchAPI; print('[OK] All dependencies imported successfully!')"
          & $pyExe -c "import sys; print('[OK] Python version:', sys.version)"

      - name: Package into ZIP archive and determine release metadata
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          $refType = $env:GITHUB_REF_TYPE
          $eventName = $env:GITHUB_EVENT_NAME
          $shaShort = $env:GITHUB_SHA.Substring(0, 7)

          if ($refType -eq "tag" -or $eventName -eq "release") {
              $releaseTag = if ($refName) { $refName } else { "release" }
              $isPreRelease = "false"
              $makeLatest = "true"
              $releaseTitle = "SYSTEM OBS Templates $releaseTag"
              $zipName = "SYSTEM-OBS-Templates-$releaseTag-Windows-Portable.zip"
          } else {
              # Push to unstable or manual workflow_dispatch triggers rolling nightly build
              $releaseTag = "nightly"
              $isPreRelease = "true"
              $makeLatest = "false"
              $releaseTitle = "SYSTEM OBS Templates — Nightly (commit $shaShort)"
              $zipName = "SYSTEM-OBS-Templates-nightly-Windows-Portable.zip"
          }

          $zipPath = "dist\$zipName"
          Write-Host "[+] Compressing into $zipPath..."
          Compress-Archive -Path "build_staging\SYSTEM-OBS-Templates-Portable\*" -DestinationPath $zipPath -CompressionLevel Optimal

          $sizeMb = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "[OK] Archive created successfully: $zipName ($sizeMb MB)"

          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$releaseTag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TITLE=$releaseTitle"
          Add-Content -Path $env:GITHUB_ENV -Value "IS_PRERELEASE=$isPreRelease"
          Add-Content -Path $env:GITHUB_ENV -Value "MAKE_LATEST=$makeLatest"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE_NAME=$zipName"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE_PATH=$zipPath"

      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ## SYSTEM Broadcast Templates — Windows Portable
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Type**: ${{ env.IS_PRERELEASE == 'true' && 'Rolling Nightly Pre-release (Auto-built from unstable)' || 'Official Release' }}

            Self-contained standalone package with embedded Python 3.12 x64.
            No Python installation required: extract anywhere and launch `start.bat` or `settings.bat`.
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST == 'true' }}
          generate_release_notes: ${{ env.IS_PRERELEASE != 'true' }}
          files: ${{ env.ARCHIVE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
