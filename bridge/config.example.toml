[server]
host = "127.0.0.1"
port = 8787

[twitch]
enabled = false
client_id = ""
client_secret = ""
include_follows = false
# Редирект URL для разовой авторизации (должен совпадать с указанным в консоли разработчика Twitch):
redirect_url = "http://localhost:3000"

# Twitch Chat (anonymous IRC connection — no OAuth token required)
[twitch_chat]
enabled = false
channel = ""
# Источник 7TV смайлов: "direct" | "mirror" | "auto"
# "direct" - напрямую с 7tv.app / 7tv.io (быстро, рекомендуется при использовании VPN или за пределами РФ)
# "mirror" - через зеркало JeetBot (для РФ без VPN, если 7tv заблокирован провайдером)
# "auto"   - сначала direct, при таймауте fallback на mirror
seven_tv_source = "direct"
seven_tv_mirror = "https://enhanced.jeetbot.cc"

# 3. ДОНАТЫ DONATIONALERTS
[donationalerts]
enabled = false
# Рекомендуется: укажи client_id и client_secret из https://www.donationalerts.com/application/clients
# (В поле Redirect URI в настройках приложения укажи: http://localhost:8787/api/da/callback).
# Авторизация выполнится автоматически в 1 клик при старте!
client_id = ""
client_secret = ""
# Либо готовый access_token (если сгенерирован вручную):
access_token = ""

# 4. ДОНАТЫ И ЗАКАЗ ТРЕКОВ DONATEX
[donatex]
enabled = false
# External token из donatex.gg -> Настройки -> Api
token = ""

# 5. ЦЕЛЬ СБОРА (DONATION GOAL)
[goal]
enabled = false
title = "Сбор на цель"
current = 0.0
target = 10000.0
currency = "RUB"

# 6. ЧАТ TTS (СИНТЕЗ РЕЧИ ЯНДЕКС АЛИСА)
[tts]
# Режим: "all" (все сообщения) | "rewards" (только за баллы канала Twitch) | "off" (выключено)
mode = "off"
# Основной голос / фоллбек:
# Доступные: "shitova.us" (Алиса), "jane", "oksana", "alyss", "omazh",
#            "ermil", "zahar", "kolya", "kostya", "valtz", "sasha",
#            "krosh" (Крош из Смешариков), "robot" (Робот)
voice = "shitova.us"
# Скорость речи: "0.9" .. "1.1" .. "1.4"
speed = "1"
# Эмоция: "neutral" | "good" (радостная) | "evil" (саркастичная)
emotion = "neutral"
# Громкость озвучки (0.0 .. 1.0)
volume = 0.80
# Максимальная длина озвучиваемого текста (символов)
max_length = 200
# Название награды за баллы канала (для режима "rewards")
reward_name = "TTS"
# Публичный токен шлюза Яндекс.Браузера
auth_token = "14e2f152-e03a-439d-9abe-f470c27db24e"
# Пул голосов для случайного выбора по нику зрителя
random_pool = ["ermil", "zahar", "jane", "alyss", "omazh", "oksana", "kolya", "valtz", "kostya", "sasha", "krosh", "robot"]

# Персональные закрепленные голоса для избранных чаттеров (VIP-привязка)
[tts.vip_voices]
# streamer_friend = "krosh"
# top_moderator = "robot"
