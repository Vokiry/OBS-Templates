[server]
host = "127.0.0.1"
port = 8787

[twitch]
enabled = false
client_id = ""
client_secret = ""
include_follows = false
# Редирект URL для разовой авторизации (должен совпадать с указанным в консоли разработчика Twitch):
redirect_url = "http://localhost:3000"

# Twitch Chat (anonymous IRC connection — no OAuth token required)
[twitch_chat]
enabled = false
channel = ""
# Источник 7TV смайлов: "direct" | "mirror" | "auto"
# "direct" - напрямую с 7tv.app / 7tv.io (быстро, рекомендуется при использовании VPN или за пределами РФ)
# "mirror" - через зеркало JeetBot (для РФ без VPN, если 7tv заблокирован провайдером)
# "auto"   - сначала direct, при таймауте fallback на mirror
seven_tv_source = "direct"
seven_tv_mirror = "https://enhanced.jeetbot.cc"

# 3. ДОНАТЫ DONATIONALERTS
[donationalerts]
enabled = false
# Рекомендуется: укажи client_id и client_secret из https://www.donationalerts.com/application/clients
# (В поле Redirect URI в настройках приложения укажи: http://localhost:8787/api/da/callback).
# Авторизация выполнится автоматически в 1 клик при старте!
client_id = ""
client_secret = ""
# Либо готовый access_token (если сгенерирован вручную):
access_token = ""

# 4. ДОНАТЫ И ЗАКАЗ ТРЕКОВ DONATEX
[donatex]
enabled = false
# External token из donatex.gg -> Настройки -> Api
token = ""

# 5. ФОНОВАЯ МУЗЫКА (MPRIS / playerctl: Kopuz, Spotify, Яндекс.Музыка, Cider, браузер)
[player]
enabled = true
# Имя плеера ("kopuz", "spotify", "firefox" или "" для автовыбора)
player_name = "kopuz"
poll_interval = 1.0