[tool.ruff]
target-version = "py310"
line-length = 110
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "src/fonts",
    "src/sounds",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["bridge", "adapters", "services", "core", "server", "obs"]
