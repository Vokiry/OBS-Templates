<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — OBS Dock</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="dock.css?v=4">
</head>
<body>
  <div class="dock">
    <!-- Header with 2-line mini status -->
    <header class="dock__header">
      <div class="dock__header-top">
        <span class="dock__title">SYSTEM // DOCK</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <a href="/settings" target="_blank" class="dock__config-link" title="Open Web Settings">[ CONFIG ]</a>
          <span class="dock__ovl" id="tag-ovl">0 OVL</span>
        </div>
      </div>
      <div class="dock__status-bar">
        <span class="dock__tag is-ok" id="bridge-status" style="color: #63E6BE;">● ONLINE</span>
        <span class="dock__tag is-off" id="tag-tw" title="Twitch Events" style="color: #E5484D;">○ TW</span>
        <span class="dock__tag is-off" id="tag-chat" title="Twitch Chat" style="color: #E5484D;">○ CHAT</span>
        <span class="dock__tag is-off" id="tag-da" title="DonationAlerts" style="color: #E5484D;">○ DA</span>
        <span class="dock__tag is-off" id="tag-dx" title="DonateX" style="color: #E5484D;">○ DX</span>
      </div>
    </header>

    <!-- 1. Stream State -->
    <div class="dock__section">
      <div class="dock__section-label">stream state</div>
      <div class="dock__grid dock__grid--3">
        <button class="dock__btn" onclick="setState('starting')">STARTING</button>
        <button class="dock__btn dock__btn--active" onclick="setState('main')">MAIN</button>
        <button class="dock__btn" onclick="setState('chatting')">CHAT</button>
        <button class="dock__btn" onclick="setState('focus')">FOCUS</button>
        <button class="dock__btn" onclick="setState('brb')">BRB</button>
        <button class="dock__btn" onclick="setState('ending')">ENDING</button>
      </div>
    </div>

    <!-- 2. Countdown Timer -->
    <div class="dock__section">
      <div class="dock__section-label">timer control</div>
      <div class="dock__grid dock__grid--4">
        <button class="dock__btn" onclick="setTimer(5)">5M</button>
        <button class="dock__btn" onclick="setTimer(10)">10M</button>
        <button class="dock__btn" onclick="setTimer(15)">15M</button>
        <button class="dock__btn" onclick="setTimer(20)">20M</button>
      </div>
      <div class="dock__grid dock__grid--4" style="margin-top: 2px;">
        <button class="dock__btn" onclick="adjustTimer(-60)">-1M</button>
        <button class="dock__btn" onclick="adjustTimer(60)">+1M</button>
        <button class="dock__btn" id="btn-timer-pause" onclick="toggleTimerPause()">PAUSE</button>
        <button class="dock__btn" onclick="resetTimer()">RESET</button>
      </div>
    </div>

    <!-- 3. Media (YouTube / DonateX Queue) -->
    <div class="dock__section">
      <div class="dock__section-label">media</div>
      <div class="dock__grid">
        <button class="dock__btn" id="btn-media-pause" onclick="toggleMediaPause()">PAUSE</button>
        <button class="dock__btn" onclick="skipMedia()">SKIP</button>
      </div>
    </div>

    <!-- 4. Live Actions (Alerts & Chat) -->
    <div class="dock__section">
      <div class="dock__section-label">live actions</div>
      <div class="dock__grid">
        <button class="dock__btn" onclick="skipAlert()">SKIP ALERT</button>
        <button class="dock__btn" onclick="clearChat()">CLEAR CHAT</button>
      </div>
    </div>

    <div class="dock__toast" id="toast"></div>

    <!-- 5. Minimalist Dev Simulation Strip -->
    <footer class="dock__dev">
      <span class="dock__dev-prompt">// test:</span>
      <button class="dock__dev-btn" onclick="sendAlert('sub', 'alice · tier 1')"><u>sub</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('resub', 'bob · 12 mo')"><u>resub</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('raid', 'carol · 42 viewers')"><u>raid</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('donate', 'dave · $25.00', 'Top stream vibes!')"><u>donate</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('cheer', 'erin · 500 bits')"><u>cheer</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('follow', 'frank connected')"><u>follow</u></button>
      <button class="dock__dev-btn" onclick="sendYouTubeTest()"><u>yt</u></button>
      <button class="dock__dev-btn" onclick="sendAnnouncement('Streamer', 'Important announcement for chat!', 'PRIMARY')"><u>ann</u></button>
      <button class="dock__dev-btn" onclick="sendTestPoll()"><u>poll</u></button>
      <button class="dock__dev-btn" onclick="sendTestPrediction()"><u>pred</u></button>
      <button class="dock__dev-btn" onclick="sendTestReward()"><u>rwd</u></button>
      <button class="dock__dev-btn" onclick="sendChat('Viewer', 'RainTime vibes!', '#63E6BE')"><u>7tv</u></button>
      <button class="dock__dev-btn" onclick="sendChat('MediaUser', 'meme https://media.tenor.com/2l3mQ2s3h38AAAAC/cat-jam.gif')"><u>gif</u></button>
    </footer>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function sendNotify(payload) {
      try {
        const res = await fetch(`${API_BASE}/notify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        showToast(res.ok ? 'OK' : 'ERR');
      } catch (err) {
        showToast('OFFLINE');
      }
    }

    function showToast(text) {
      const el = document.getElementById('toast');
      el.textContent = `[ ${text} ]`;
      setTimeout(() => { if (el.textContent === `[ ${text} ]`) el.textContent = ''; }, 1800);
    }

    function setState(state) {
      document.querySelectorAll('.dock__grid--3 .dock__btn').forEach(b => {
        b.classList.toggle('dock__btn--active', b.textContent.toLowerCase().includes(state));
      });
      sendNotify({ type: 'status', state });
    }

    function setTimer(minutes) {
      sendNotify({ type: 'countdown_control', action: 'set', minutes: Number(minutes) });
    }

    function adjustTimer(deltaSeconds) {
      sendNotify({ type: 'countdown_control', action: 'adjust', deltaSeconds });
    }

    let isTimerPaused = false;
    function toggleTimerPause() {
      isTimerPaused = !isTimerPaused;
      const btn = document.getElementById('btn-timer-pause');
      if (btn) btn.textContent = isTimerPaused ? 'RESUME' : 'PAUSE';
      sendNotify({ type: 'countdown_control', action: isTimerPaused ? 'pause' : 'resume' });
    }

    function resetTimer() {
      isTimerPaused = false;
      const btn = document.getElementById('btn-timer-pause');
      if (btn) btn.textContent = 'PAUSE';
      sendNotify({ type: 'countdown_control', action: 'reset' });
    }

    let isMediaPaused = false;
    function toggleMediaPause() {
      isMediaPaused = !isMediaPaused;
      const btn = document.getElementById('btn-media-pause');
      if (btn) btn.textContent = isMediaPaused ? 'RESUME' : 'PAUSE';
      sendNotify({ type: 'media_control', action: isMediaPaused ? 'pause' : 'resume' });
    }

    async function skipMedia() {
      try {
        const res = await fetch(`${API_BASE}/api/media/skip`, { method: 'POST' });
        showToast(res.ok ? 'TRACK SKIPPED' : 'ERR');
      } catch (e) {
        sendNotify({ type: 'media_control', action: 'skip' });
      }
    }

    async function skipAlert() {
      try {
        const res = await fetch(`${API_BASE}/api/donations/skip`, { method: 'POST' });
        showToast(res.ok ? 'ALERT SKIPPED' : 'ERR');
      } catch (e) {
        sendNotify({ type: 'alert_skip' });
      }
    }

    function clearChat() {
      sendNotify({ type: 'chat_clear' });
    }

    // Dev Simulation Triggers
    function sendAlert(kind, user, message) {
      sendNotify({ kind, user, message });
    }

    function sendYouTubeTest() {
      sendNotify({
        type: 'media_request',
        user: 'MusicFan',
        amount: '250 ₽',
        message: 'Track request test',
        youtubeId: 'jfKfPfyJRdk',
        title: 'Lofi Hip Hop Radio — Beats to Relax'
      });
    }

    function sendChat(user, text, color) {
      sendNotify({ type: 'chat', user, text, color });
    }

    function sendAnnouncement(user, text, color = 'PRIMARY') {
      sendNotify({
        type: 'chat',
        subtype: 'announcement',
        user: user,
        text: text,
        announcementColor: color
      });
    }

    let testPollState = 0;
    function sendTestPoll() {
      testPollState = (testPollState + 1) % 3;
      if (testPollState === 1) {
        const ends = new Date(Date.now() + 90000).toISOString();
        sendNotify({
          type: 'poll',
          action: 'begin',
          id: 'test_poll_1',
          title: 'Играем сегодня в хоррор?',
          choices: [
            { id: '1', title: 'Да, обязательно!', votes: 14, percent: 70 },
            { id: '2', title: 'Нет, давай чилл', votes: 6, percent: 30 }
          ],
          totalVotes: 20,
          status: 'active',
          endsAt: ends
        });
        showToast('POLL STARTED');
      } else if (testPollState === 2) {
        sendNotify({
          type: 'poll',
          action: 'progress',
          id: 'test_poll_1',
          title: 'Играем сегодня в хоррор?',
          choices: [
            { id: '1', title: 'Да, обязательно!', votes: 32, percent: 80 },
            { id: '2', title: 'Нет, давай чилл', votes: 8, percent: 20 }
          ],
          totalVotes: 40,
          status: 'active',
          endsAt: new Date(Date.now() + 45000).toISOString()
        });
        showToast('POLL UPDATED');
      } else {
        sendNotify({
          type: 'poll',
          action: 'end',
          id: 'test_poll_1',
          title: 'Играем сегодня в хоррор?',
          choices: [
            { id: '1', title: 'Да, обязательно!', votes: 45, percent: 82 },
            { id: '2', title: 'Нет, давай чилл', votes: 10, percent: 18 }
          ],
          totalVotes: 55,
          status: 'completed'
        });
        showToast('POLL ENDED');
      }
    }

    let testPredState = 0;
    function sendTestPrediction() {
      testPredState = (testPredState + 1) % 3;
      if (testPredState === 1) {
        sendNotify({
          type: 'prediction',
          action: 'begin',
          id: 'test_pred_1',
          title: 'Выиграем следующую катку?',
          status: 'ACTIVE',
          outcomes: [
            { id: '1', title: 'Победа', color: 'blue', points: 34200, percent: 65, users: 48 },
            { id: '2', title: 'Поражение', color: 'pink', points: 18400, percent: 35, users: 24 }
          ],
          totalPoints: 52600
        });
        showToast('PRED STARTED');
      } else if (testPredState === 2) {
        sendNotify({
          type: 'prediction',
          action: 'lock',
          id: 'test_pred_1',
          title: 'Выиграем следующую катку?',
          status: 'LOCKED',
          outcomes: [
            { id: '1', title: 'Победа', color: 'blue', points: 51200, percent: 68, users: 70 },
            { id: '2', title: 'Поражение', color: 'pink', points: 24100, percent: 32, users: 35 }
          ],
          totalPoints: 75300
        });
        showToast('PRED LOCKED');
      } else {
        sendNotify({
          type: 'prediction',
          action: 'end',
          id: 'test_pred_1',
          title: 'Выиграем следующую катку?',
          status: 'RESOLVED',
          winningOutcomeId: '1',
          outcomes: [
            { id: '1', title: 'Победа', color: 'blue', points: 51200, percent: 68, users: 70, isWinner: true },
            { id: '2', title: 'Поражение', color: 'pink', points: 24100, percent: 32, users: 35 }
          ],
          totalPoints: 75300
        });
        showToast('PRED RESOLVED');
      }
    }

    function sendTestReward() {
      sendNotify({
        type: 'chat',
        subtype: 'reward',
        user: 'LoyalViewer',
        rewardTitle: 'Попить воды',
        rewardCost: 350,
        text: 'Держи водный баланс на стриме!'
      });
      showToast('REWARD SENT');
    }

    async function pollHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (res.ok) {
          const data = await res.json();
          const ovl = document.getElementById('tag-ovl');
          if (ovl) ovl.textContent = `${data.overlays ?? 0} OVL`;

          const setTag = (id, label, active) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = (active ? '● ' : '○ ') + label;
            el.classList.toggle('is-off', !active);
            el.classList.toggle('is-ok', !!active);
            el.style.color = active ? '#63E6BE' : '#E5484D';
          };

          setTag('tag-tw', 'TW', data.adapters?.twitch);
          setTag('tag-chat', 'CHAT', data.adapters?.twitch_chat);
          setTag('tag-da', 'DA', data.adapters?.donationalerts);
          setTag('tag-dx', 'DX', data.adapters?.donatex);

          const badge = document.getElementById('bridge-status');
          badge.textContent = '● ONLINE';
          badge.classList.remove('is-off');
          badge.classList.add('is-ok');
          badge.style.color = '#63E6BE';
        }
      } catch (e) {
        const badge = document.getElementById('bridge-status');
        badge.textContent = '○ OFFLINE';
        badge.classList.add('is-off');
        badge.classList.remove('is-ok');
        badge.style.color = '#E5484D';
      }
    }

    pollHealth();
    setInterval(pollHealth, 3000);
  </script>
</body>
</html>
