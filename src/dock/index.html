<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — OBS Dock</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="dock.css">
</head>
<body>
  <div class="dock">
    <header class="dock__header">
      <span class="dock__title">SYSTEM // DOCK</span>
      <span class="dock__status-badge" id="bridge-status">ONLINE</span>
    </header>

    <!-- Compact Horizontal Telemetry Bar -->
    <div class="dock__telemetry-bar">
      <div class="dock__telemetry-pill">
        <span class="dock__telemetry-label">OVL</span>
        <span class="dock__telemetry-val" id="overlay-count">0</span>
      </div>
      <div class="dock__telemetry-pill">
        <span class="dock__telemetry-label">TW</span>
        <span class="dock__telemetry-val is-off" id="twitch-status">OFF</span>
      </div>
      <div class="dock__telemetry-pill">
        <span class="dock__telemetry-label">CHAT</span>
        <span class="dock__telemetry-val is-off" id="chat-status">OFF</span>
      </div>
      <div class="dock__telemetry-pill">
        <span class="dock__telemetry-label">DA</span>
        <span class="dock__telemetry-val is-off" id="da-status">OFF</span>
      </div>
      <div class="dock__telemetry-pill">
        <span class="dock__telemetry-label">DX</span>
        <span class="dock__telemetry-val is-off" id="donatex-status">OFF</span>
      </div>
    </div>

    <!-- 1. Stream State Switcher -->
    <div class="dock__section">
      <div class="dock__section-label">stream state</div>
      <div class="dock__grid dock__grid--3">
        <button class="dock__btn" onclick="setState('starting')">Starting</button>
        <button class="dock__btn dock__btn--active" onclick="setState('main')">Main</button>
        <button class="dock__btn" onclick="setState('chatting')">Chat</button>
        <button class="dock__btn" onclick="setState('focus')">Focus</button>
        <button class="dock__btn" onclick="setState('brb')">BRB</button>
        <button class="dock__btn" onclick="setState('ending')">Ending</button>
      </div>
    </div>

    <!-- 2. Countdown Timer Controller -->
    <div class="dock__section">
      <div class="dock__section-label">timer control</div>
      <div class="dock__grid dock__grid--4">
        <button class="dock__btn" onclick="setTimer(5)">5m</button>
        <button class="dock__btn" onclick="setTimer(10)">10m</button>
        <button class="dock__btn" onclick="setTimer(15)">15m</button>
        <button class="dock__btn" onclick="setTimer(20)">20m</button>
      </div>
      <div class="dock__grid dock__grid--4" style="margin-top: 2px;">
        <button class="dock__btn" onclick="adjustTimer(-60)">-1m</button>
        <button class="dock__btn" onclick="adjustTimer(60)">+1m</button>
        <button class="dock__btn" id="btn-timer-pause" onclick="toggleTimerPause()">Pause</button>
        <button class="dock__btn" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- 3. Media & Music (YouTube / DonateX Queue) -->
    <div class="dock__section">
      <div class="dock__section-label">media & music</div>
      <div class="dock__grid dock__grid--3">
        <button class="dock__btn dock__btn--action" id="btn-media-pause" onclick="toggleMediaPause()">⏯ Pause</button>
        <button class="dock__btn dock__btn--action" onclick="skipMedia()">⏭ Skip</button>
        <button class="dock__btn dock__btn--action" onclick="stopMedia()">⏹ Stop</button>
      </div>
    </div>

    <!-- 4. Live Actions (Alerts & Chat) -->
    <div class="dock__section">
      <div class="dock__section-label">live actions</div>
      <div class="dock__grid dock__grid--2">
        <button class="dock__btn dock__btn--action" onclick="skipAlert()">⏭ Skip Alert</button>
        <button class="dock__btn dock__btn--action" onclick="clearChat()">🧹 Clear Chat</button>
      </div>
    </div>

    <div class="dock__toast" id="toast"></div>

    <!-- 5. Minimalist Dev & Emulation links (Unobtrusive) -->
    <div class="dock__dev">
      <div class="dock__dev-header">// dev & test simulation</div>
      <div class="dock__dev-links">
        <button class="dock__dev-link" onclick="sendAlert('sub', 'alice · tier 1')">+sub</button>
        <button class="dock__dev-link" onclick="sendAlert('resub', 'bob · 12 mo')">+resub</button>
        <button class="dock__dev-link" onclick="sendAlert('raid', 'carol · 42 viewers')">+raid</button>
        <button class="dock__dev-link" onclick="sendAlert('donate', 'dave · $25.00', 'Top stream vibes!')">+donate</button>
        <button class="dock__dev-link" onclick="sendAlert('cheer', 'erin · 500 bits')">+cheer</button>
        <button class="dock__dev-link" onclick="sendAlert('follow', 'frank connected')">+follow</button>
        <button class="dock__dev-link" onclick="sendYouTubeTest()">+test-yt</button>
        <button class="dock__dev-link" onclick="sendChat('Viewer', 'RainTime vibes!', '#63E6BE')">+7tv-msg</button>
        <button class="dock__dev-link" onclick="sendChat('MediaUser', 'meme https://media.tenor.com/2l3mQ2s3h38AAAAC/cat-jam.gif')">+gif-msg</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function sendNotify(payload) {
      try {
        const res = await fetch(`${API_BASE}/notify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        showToast(res.ok ? 'Sent successfully' : 'Error sending');
      } catch (err) {
        showToast('Bridge offline');
      }
    }

    function showToast(text) {
      const el = document.getElementById('toast');
      el.textContent = `[ ${text} ]`;
      setTimeout(() => { if (el.textContent === `[ ${text} ]`) el.textContent = ''; }, 2000);
    }

    function setState(state) {
      document.querySelectorAll('.dock__grid--3 .dock__btn').forEach(b => {
        b.classList.toggle('dock__btn--active', b.textContent.toLowerCase().includes(state));
      });
      sendNotify({ type: 'status', state });
    }

    function setTimer(minutes) {
      sendNotify({ type: 'countdown_control', action: 'set', minutes: Number(minutes) });
    }

    function adjustTimer(deltaSeconds) {
      sendNotify({ type: 'countdown_control', action: 'adjust', deltaSeconds });
    }

    let isTimerPaused = false;
    function toggleTimerPause() {
      isTimerPaused = !isTimerPaused;
      const btn = document.getElementById('btn-timer-pause');
      if (btn) btn.textContent = isTimerPaused ? 'Resume' : 'Pause';
      sendNotify({ type: 'countdown_control', action: isTimerPaused ? 'pause' : 'resume' });
    }

    function resetTimer() {
      isTimerPaused = false;
      const btn = document.getElementById('btn-timer-pause');
      if (btn) btn.textContent = 'Pause';
      sendNotify({ type: 'countdown_control', action: 'reset' });
    }

    let isMediaPaused = false;
    function toggleMediaPause() {
      isMediaPaused = !isMediaPaused;
      const btn = document.getElementById('btn-media-pause');
      if (btn) btn.textContent = isMediaPaused ? '▶ Play' : '⏸ Pause';
      sendNotify({ type: 'media_control', action: isMediaPaused ? 'pause' : 'resume' });
    }

    async function skipMedia() {
      try {
        const res = await fetch(`${API_BASE}/api/media/skip`, { method: 'POST' });
        showToast(res.ok ? 'Track skipped' : 'Error skipping track');
      } catch (e) {
        sendNotify({ type: 'media_control', action: 'skip' });
      }
    }

    function stopMedia() {
      isMediaPaused = false;
      const btn = document.getElementById('btn-media-pause');
      if (btn) btn.textContent = '⏸ Pause';
      sendNotify({ type: 'media_control', action: 'stop' });
    }

    async function skipAlert() {
      try {
        const res = await fetch(`${API_BASE}/api/donations/skip`, { method: 'POST' });
        showToast(res.ok ? 'Alert skipped' : 'Error skipping alert');
      } catch (e) {
        sendNotify({ type: 'alert_skip' });
      }
    }

    function clearChat() {
      sendNotify({ type: 'chat_clear' });
    }

    // Dev Simulation Triggers
    function sendAlert(kind, user, message) {
      sendNotify({ kind, user, message });
    }

    function sendYouTubeTest() {
      sendNotify({
        type: 'media_request',
        user: 'MusicFan',
        amount: '250 ₽',
        message: 'Поставь этот трек на стрим!',
        youtubeId: 'jfKfPfyJRdk',
        title: 'Lofi Hip Hop Radio — Beats to Relax'
      });
    }

    function sendChat(user, text, color) {
      sendNotify({ type: 'chat', user, text, color });
    }

    async function pollHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('overlay-count').textContent = data.overlays ?? 0;

          const setStatus = (id, active) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = active ? 'ON' : 'OFF';
            el.classList.toggle('is-off', !active);
          };

          setStatus('twitch-status', data.adapters?.twitch);
          setStatus('chat-status', data.adapters?.twitch_chat);
          setStatus('da-status', data.adapters?.donationalerts);
          setStatus('donatex-status', data.adapters?.donatex);

          const badge = document.getElementById('bridge-status');
          badge.textContent = 'ONLINE';
          badge.style.color = 'var(--color-accent)';
        }
      } catch (e) {
        const badge = document.getElementById('bridge-status');
        badge.textContent = 'OFFLINE';
        badge.style.color = 'var(--color-danger)';
      }
    }

    pollHealth();
    setInterval(pollHealth, 3000);
  </script>
</body>
</html>
