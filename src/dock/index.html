<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — OBS Dock</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="dock.css?v=4">
</head>
<body>
  <div class="dock">
    <!-- Header with 2-line mini status -->
    <header class="dock__header">
      <div class="dock__header-top">
        <span class="dock__title">SYSTEM // DOCK</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <a href="/panels" target="_blank" class="dock__config-link" id="dock-panels-btn" title="Open Twitch Panels Generator" style="display: none;">[ PANELS ]</a>
          <a href="/settings" target="_blank" class="dock__config-link" id="dock-config-btn" title="Open Web Settings" style="display: none;">[ CONFIG ]</a>
          <span class="dock__ovl" id="tag-ovl">0 OVL</span>
        </div>
      </div>
      <div class="dock__status-bar">
        <span class="dock__tag is-ok" id="bridge-status" style="color: #63E6BE;">● ONLINE</span>
        <span class="dock__tag is-off" id="tag-tw" title="Twitch Events" style="color: #E5484D;">○ TW</span>
        <span class="dock__tag is-off" id="tag-chat" title="Twitch Chat" style="color: #E5484D;">○ CHAT</span>
        <span class="dock__tag is-off" id="tag-da" title="DonationAlerts" style="color: #E5484D;">○ DA</span>
        <span class="dock__tag is-off" id="tag-dx" title="DonateX" style="color: #E5484D;">○ DX</span>
        <span class="dock__stream-stats" id="stream-stats">[ OFFLINE ]</span>
      </div>
    </header>

    <!-- 1. Stream State -->
    <div class="dock__section">
      <div class="dock__section-label">stream state</div>
      <div class="dock__grid dock__grid--3">
        <button class="dock__btn" onclick="setState('starting')">STARTING</button>
        <button class="dock__btn dock__btn--active" onclick="setState('main')">MAIN</button>
        <button class="dock__btn" onclick="setState('chatting')">CHAT</button>
        <button class="dock__btn" onclick="setState('focus')">FOCUS</button>
        <button class="dock__btn" onclick="setState('brb')">BRB</button>
        <button class="dock__btn" onclick="setState('ending')">ENDING</button>
      </div>
    </div>

    <!-- 2. Countdown Timer -->
    <div class="dock__section">
      <div class="dock__section-label">timer control</div>
      <div class="dock__grid dock__grid--4">
        <button class="dock__btn" onclick="setTimer(5)">5M</button>
        <button class="dock__btn" onclick="setTimer(10)">10M</button>
        <button class="dock__btn" onclick="setTimer(15)">15M</button>
        <button class="dock__btn" onclick="setTimer(20)">20M</button>
      </div>
      <div class="dock__grid dock__grid--4" style="margin-top: 2px;">
        <button class="dock__btn" onclick="adjustTimer(-60)">-1M</button>
        <button class="dock__btn" onclick="adjustTimer(60)">+1M</button>
        <button class="dock__btn" id="btn-timer-pause" onclick="toggleTimerPause()">PAUSE</button>
        <button class="dock__btn" onclick="resetTimer()">RESET</button>
      </div>
    </div>

    <!-- 3. Media (YouTube / DonateX Queue) -->
    <div class="dock__section">
      <div class="dock__section-label">media</div>
      <div class="dock__grid">
        <button class="dock__btn" id="btn-media-pause" onclick="toggleMediaPause()">PAUSE</button>
        <button class="dock__btn" onclick="skipMedia()">SKIP</button>
      </div>
    </div>

    <!-- 4. Live Actions (Alerts, Chat & TTS) -->
    <div class="dock__section">
      <div class="dock__section-label">live actions</div>
      <div class="dock__grid dock__grid--3">
        <button class="dock__btn" onclick="skipAlert()">SKIP ALERT</button>
        <button class="dock__btn" onclick="replayAlert()" id="btn-replay-alert" title="Replay the last received alert">REPLAY</button>
        <button class="dock__btn" onclick="clearChat()">CLEAR CHAT</button>
      </div>
      <div class="dock__grid" style="margin-top: 3px;">
        <button class="dock__btn" onclick="stopTTS()" style="color: #E5484D;">STOP TTS</button>
        <button class="dock__btn" onclick="toggleDND()" id="btn-dnd" title="Do Not Disturb: mute alert sounds & TTS during cutscenes">DND: OFF</button>
      </div>
    </div>

    <div class="dock__toast" id="toast"></div>

    <!-- 5. Minimalist Dev Simulation Strip -->
    <footer class="dock__dev">
      <span class="dock__dev-prompt">// test:</span>
      <button class="dock__dev-btn" onclick="sendAlert('sub', 'alice · tier 1')"><u>sub</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('resub', 'bob · 12 mo')"><u>resub</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('raid', 'carol · 42 viewers')"><u>raid</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('donate', 'dave · $25.00', 'Top stream vibes!')"><u>donate</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('cheer', 'erin · 500 bits')"><u>cheer</u></button>
      <button class="dock__dev-btn" onclick="sendAlert('follow', 'frank connected')"><u>follow</u></button>
      <button class="dock__dev-btn" onclick="sendYouTubeTest()"><u>yt</u></button>
      <button class="dock__dev-btn" onclick="sendAnnouncement('Streamer', 'Important announcement for chat!', 'PRIMARY')"><u>ann</u></button>
      <button class="dock__dev-btn" onclick="sendTestPoll()"><u>poll</u></button>
      <button class="dock__dev-btn" onclick="sendTestPrediction()"><u>pred</u></button>
      <button class="dock__dev-btn" onclick="sendTestReward()"><u>rwd</u></button>
      <button class="dock__dev-btn" onclick="sendChat('Viewer', 'RainTime vibes!', '#63E6BE')"><u>7tv</u></button>
      <button class="dock__dev-btn" onclick="sendChat('MediaUser', 'meme https://media.tenor.com/2l3mQ2s3h38AAAAC/cat-jam.gif')"><u>gif</u></button>
      <button class="dock__dev-btn" onclick="sendTestTTS()"><u>tts</u></button>
    </footer>
  </div>

  <script src="dock.js"></script>
</body>
</html>
