<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — alerts</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/alerts.css">
</head>
<body>
  <div class="overlay">
    <div class="alerts"></div>
  </div>

  <script src="../components/alerts.js"></script>
  <script src="overlay.js"></script>
  <script>
    (() => {
    const params = new URLSearchParams(location.search);

    const queue = new AlertQueue(document.querySelector('.alerts'), {
      holdMs: params.has('hold') ? parseInt(params.get('hold'), 10) : undefined,
      maxVisible: params.has('max') ? parseInt(params.get('max'), 10) : undefined,
      sfx: params.get('sfx') !== 'off',
      volume: params.has('vol') ? parseFloat(params.get('vol')) : undefined,
    });

    window.systemAlerts = (eventOrTitle, body, message) => {
      if (typeof eventOrTitle === 'object' && eventOrTitle !== null) {
        queue.enqueue(eventOrTitle);
      } else {
        queue.enqueue({ title: eventOrTitle, body, message });
      }
    };

    const DEMO_EVENTS = [
      { title: 'NEW SUB', body: 'username · tier 1', kind: 'sub' },
      { title: 'RESUB', body: 'username · 12 months', kind: 'resub' },
      { title: 'GIFT SUB', body: 'username × 5', kind: 'gift' },
      { title: 'RAID', body: 'username · 42 viewers', kind: 'raid' },
      { title: 'CHEER', body: 'username · 500', kind: 'cheer' },
      { title: 'NEW DONATION', body: 'dave · $25.00', kind: 'donate', message: 'Top tier stream, thank you for the vibes!' },
    ];

    const mode = params.get('demo');

    if (mode) {
      if (mode === 'once') {
        DEMO_EVENTS.forEach((event, index) => {
          setTimeout(() => queue.enqueue(event), index * 5200);
        });
      } else {
        let index = 0;
        setInterval(() => {
          const event = DEMO_EVENTS[index % DEMO_EVENTS.length];
          index += 1;
          queue.enqueue(event);
        }, 5500);
      }
    }

    const wsParam = params.get('ws');
    if (wsParam !== 'off') {
      const wsUrl = wsParam || `ws://${location.host || '127.0.0.1:8787'}/events`;
      let retryDelay = 1000;

      const connect = () => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => {
          retryDelay = 1000;
        };
        socket.onmessage = (message) => {
          try {
            const data = JSON.parse(message.data);
            if (data.type === 'alert' && data.title) {
              queue.enqueue(data);
            }
          } catch (error) {}
        };
        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        };
        socket.onerror = () => socket.close();
      };

      connect();
    }
    })();
  </script>
</body>
</html>
