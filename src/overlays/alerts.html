<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — alerts</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/alerts.css">
</head>
<body>
  <div class="overlay">
    <div class="alerts"></div>
  </div>

  <script src="../components/alerts.js"></script>
  <script src="overlay.js"></script>
  <script>
    (() => {
    const params = new URLSearchParams(location.search);

    const queue = new AlertQueue(document.querySelector('.alerts'), {
      holdMs: params.has('hold') ? parseInt(params.get('hold'), 10) : undefined,
      maxVisible: params.has('max') ? parseInt(params.get('max'), 10) : undefined,
    });

    window.systemAlerts = (title, body) => queue.enqueue({ title, body });

    const DEMO_EVENTS = [
      { title: 'NEW SUB', body: 'username · tier 1' },
      { title: 'RESUB', body: 'username · 12 months' },
      { title: 'GIFT SUB', body: 'username × 5' },
      { title: 'RAID', body: 'username · 42 viewers' },
      { title: 'CHEER', body: 'username · 500' },
      { title: 'DONATION', body: 'username · 5.00' },
    ];

    const mode = params.get('demo');

    if (mode) {
      if (mode === 'once') {
        DEMO_EVENTS.forEach((event, index) => {
          setTimeout(() => window.systemAlerts(event.title, event.body), index * 5200);
        });
      } else {
        let index = 0;
        setInterval(() => {
          const event = DEMO_EVENTS[index % DEMO_EVENTS.length];
          index += 1;
          window.systemAlerts(event.title, event.body);
        }, 5500);
      }
    }

    const wsParam = params.get('ws');
    if (wsParam !== 'off') {
      const wsUrl = wsParam || 'ws://127.0.0.1:8787/events';
      let retryDelay = 1000;

      const connect = () => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => {
          retryDelay = 1000;
        };
        socket.onmessage = (message) => {
          try {
            const data = JSON.parse(message.data);
            if (data.type === 'alert' && data.title) {
              window.systemAlerts(data.title, data.body || '');
            }
          } catch (error) {}
        };
        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        };
        socket.onerror = () => socket.close();
      };

      connect();
    }
    })();
  </script>
</body>
</html>
