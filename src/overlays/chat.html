<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — chat</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/chat.css">
</head>
<body>
  <div class="overlay">
    <div class="chat">
      <div class="chat__header">chat</div>
      <div class="chat__pinned-container" id="chat-pinned"></div>
      <div class="chat__body"></div>
    </div>
  </div>
  <script src="overlay.js"></script>
  <script>
    (() => {
    const params = new URLSearchParams(location.search);
    const chatBody = document.querySelector('.chat__body');
    const maxMessages = parseInt(params.get('max'), 10) || 20;
    let hasLiveMessage = false;

    let cdnBase = 'https://cdn.7tv.app/emote';
    if (params.get('source') === 'mirror') {
      cdnBase = 'https://enhanced.jeetbot.cc/https://cdn.7tv.app/emote';
    }

    function get7TvEmoteUrl(id) {
      return `${cdnBase}/${id}/2x.webp`;
    }

    const SEED_IDS = {
      RainTime: '01FCY771D800007PQ2DF3GDTN6',
      catJAM: '01F00YT2CR0007E4VV006YKSK6',
      KEKW: '01FCY771D800007PQ2DF3GDTN6',
      peepoHappy: '60ae3e542597b2219c9b46c6',
      OMEGALUL: '60abf171870d317bef23d399',
    };

    const TWITCH_GLOBALS = {
      Kappa: 'https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/2.0',
      LUL: 'https://static-cdn.jtvnw.net/emoticons/v2/425618/default/dark/2.0',
      PogChamp: 'https://static-cdn.jtvnw.net/emoticons/v2/305954156/default/dark/2.0',
      BibleThump: 'https://static-cdn.jtvnw.net/emoticons/v2/86/default/dark/2.0',
      Kreygasm: 'https://static-cdn.jtvnw.net/emoticons/v2/41/default/dark/2.0',
      VoHiYo: 'https://static-cdn.jtvnw.net/emoticons/v2/81274/default/dark/2.0',
      HeyGuys: 'https://static-cdn.jtvnw.net/emoticons/v2/30259/default/dark/2.0',
      WutFace: 'https://static-cdn.jtvnw.net/emoticons/v2/28087/default/dark/2.0',
      NotLikeThis: 'https://static-cdn.jtvnw.net/emoticons/v2/58765/default/dark/2.0',
      ResidentSleeper: 'https://static-cdn.jtvnw.net/emoticons/v2/245/default/dark/2.0',
    };

    const emotesMap = { ...TWITCH_GLOBALS };
    function refreshSeedEmotes() {
      for (const [name, id] of Object.entries(SEED_IDS)) {
        if (!emotesMap[name] || emotesMap[name].includes('7tv')) {
          emotesMap[name] = get7TvEmoteUrl(id);
        }
      }
    }
    refreshSeedEmotes();

    const SEED_BADGES = {
      "broadcaster/1": "https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/2",
      "moderator/1": "https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/2",
      "vip/1": "https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/2",
      "subscriber/0": "https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2ff4b9e6b4f5/2",
      "subscriber/1": "https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2ff4b9e6b4f5/2",
      "partner/1": "https://static-cdn.jtvnw.net/badges/v1/d12a2e27-16f6-41d0-ab77-b780518f00a3/2",
      "turbo/1": "https://static-cdn.jtvnw.net/badges/v1/bd444ec6-8794-4c9f-8640-f759d9869422/2",
      "premium/1": "https://static-cdn.jtvnw.net/badges/v1/bbbe0db0-a598-423e-86d0-f9fb98ca1933/2",
      "sub-gifter/1": "https://static-cdn.jtvnw.net/badges/v1/f1d2543e-a1cf-41c1-be5a-2cb79f1c7d7e/2",
      "bits/1": "https://static-cdn.jtvnw.net/badges/v1/73b5c3fb-245e-4f5c-add5-bdae25160bdf/2",
      "artist-badge/1": "https://static-cdn.jtvnw.net/badges/v1/4300a897-d3c8-43e6-ac07-55e2d1eb97d1/2",
    };
    const badgesMap = { ...SEED_BADGES };

    const chatEl = document.querySelector('.chat');
    if (params.get('width') && chatEl) chatEl.style.width = params.get('width') + 'px';
    if (params.get('height') && chatEl) chatEl.style.height = params.get('height') + 'px';
    const posParam = params.get('pos');
    if (posParam === 'main-right' && chatEl) {
      chatEl.classList.add('chat--main-sidebar');
    }
    const layout = params.get('layout');
    if (layout && chatEl) {
      chatEl.dataset.layout = layout;
      if (layout === 'half') {
        chatEl.classList.add('chat--half');
        const header = document.querySelector('.chat__header');
        if (header) header.textContent = 'chat // pre-stream lobby';
      }
    }

    let hasLoadedTwitchBadges = false;
    async function loadTwitchBadges() {
      try {
        const resp = await fetch('/api/twitch/badges');
        if (resp.ok) {
          const data = await resp.json();
          Object.assign(badgesMap, data);
          hasLoadedTwitchBadges = true;
        }
      } catch (e) {}
    }
    loadTwitchBadges();

    let hasLoadedGlobalEmotes = false;
    async function loadGlobalEmotes() {
      try {
        const cfgResp = await fetch('/api/7tv/config');
        if (cfgResp.ok) {
          const cfg = await cfgResp.json();
          if (cfg.cdnBase && !params.get('source')) {
            cdnBase = cfg.cdnBase;
            refreshSeedEmotes();
          }
        }
      } catch (e) {}

      const urls = [
        '/api/7tv/global',
        'https://7tv.io/v3/emote-sets/global',
        'https://enhanced.jeetbot.cc/https://7tv.io/v3/emote-sets/global'
      ];
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const serverCdn = resp.headers.get('X-7TV-CDN-Base');
            if (serverCdn && !params.get('source')) cdnBase = serverCdn;
            const data = await resp.json();
            for (const emote of data.emotes || []) {
              if (emote.id && emote.name) {
                emotesMap[emote.name] = get7TvEmoteUrl(emote.id);
              }
            }
            refreshSeedEmotes();
            hasLoadedGlobalEmotes = true;
            break;
          }
        } catch (e) {}
      }
    }
    loadGlobalEmotes();

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadChannelEmotes(roomId) {
      if (!roomId) return;
      const urls = [
        `/api/7tv/channel/${encodeURIComponent(roomId)}`,
        `https://7tv.io/v3/users/twitch/${encodeURIComponent(roomId)}`,
        `https://enhanced.jeetbot.cc/https://7tv.io/v3/users/twitch/${encodeURIComponent(roomId)}`
      ];
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const data = await resp.json();
            for (const emote of (data.emote_set?.emotes || [])) {
              if (emote.id && emote.name) {
                emotesMap[emote.name] = get7TvEmoteUrl(emote.id);
              }
            }
            break;
          }
        } catch (e) {}
      }
    }

    if (params.get('room')) {
      loadChannelEmotes(params.get('room'));
    }

    // Media allowlist: JeetBot/PicDrisnya upload domains, Tenor, Giphy, Imgur
    const ALLOWED_MEDIA_REGEX = /(https?:\/\/(?:[a-zA-Z0-9-]+\.)*drisnya\.online\/[^\s]+|https?:\/\/(?:[a-zA-Z0-9-]+\.)*tenor\.com\/[^\s]+|https?:\/\/(?:[a-zA-Z0-9-]+\.)*giphy\.com\/[^\s]+|https?:\/\/(?:[a-zA-Z0-9-]+\.)*imgur\.com\/[^\s]+)/i;

    function extractMedia(text) {
      const match = text.match(ALLOWED_MEDIA_REGEX);
      if (!match) return { cleanText: text, mediaUrl: null };
      let mediaUrl = match[1].replace(/[.,!?;:)\"]+$/, "");
      const cleanText = text.replace(match[1], '').replace(/\s+/g, ' ').trim();
      return { cleanText, mediaUrl };
    }

    async function resolveMediaUrl(rawUrl) {
      if (!rawUrl) return null;
      if (rawUrl.includes('drisnya.online/post/')) {
        try {
          const res = await fetch(`/api/resolve-media?url=${encodeURIComponent(rawUrl)}`);
          if (res.ok) {
            const data = await res.json();
            if (data.url && data.url !== rawUrl) return data.url;
          }
        } catch (e) {}
      }
      return rawUrl;
    }

    function formatTextWithEmotes(text, twitchEmotes = []) {
      if (!text) return '';

      // 1. Process native Twitch emotes by character slice ranges if provided from IRC
      let tokens = [text];
      if (twitchEmotes && twitchEmotes.length > 0) {
        const sorted = [...twitchEmotes].sort((a, b) => b.start - a.start);
        let cur = text;
        for (const e of sorted) {
          if (e.start >= 0 && e.end <= cur.length) {
            const before = cur.slice(0, e.start);
            const after = cur.slice(e.end);
            const img = `<img class="chat__emote" src="${e.url}" alt="emote">`;
            cur = before + '\uFFF0' + img + '\uFFF1' + after;
          }
        }
        tokens = cur.split(/(\uFFF0[^\uFFF1]+\uFFF1)/);
      }

      // 2. Process remaining text chunks for 7TV & global seed emotes, safely escaping HTML
      const htmlParts = [];
      for (const token of tokens) {
        if (token.startsWith('\uFFF0') && token.endsWith('\uFFF1')) {
          htmlParts.push(token.slice(1, -1));
        } else {
          const words = token.split(' ');
          const formattedWords = words.map(w => {
            if (emotesMap[w]) {
              return `<img class="chat__emote" src="${emotesMap[w]}" alt="${w}" title="${w}">`;
            }
            return w.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          });
          htmlParts.push(formattedWords.join(' '));
        }
      }
      return htmlParts.join('');
    }

    async function addMessage(user, rawText, color, twitchEmotes = [], subtype = 'message', extra = {}) {
      if (!chatBody) return;
      if (!hasLiveMessage) {
        chatBody.innerHTML = '';
        hasLiveMessage = true;
      }

      const { cleanText, mediaUrl: rawMediaUrl } = extractMedia(rawText || '');
      const mediaUrl = rawMediaUrl ? await resolveMediaUrl(rawMediaUrl) : null;

      const msg = document.createElement('div');
      msg.className = 'chat__msg';

      if (subtype === 'announcement') {
        msg.classList.add('chat__msg--announcement');
        const annColor = (extra.announcementColor || 'primary').toLowerCase();
        msg.dataset.color = annColor;

        const headerEl = document.createElement('div');
        headerEl.className = 'chat__announcement-header';
        headerEl.textContent = `[ ANNOUNCE // ${user} ]`;
        msg.append(headerEl);
      } else if (subtype === 'reward') {
        msg.classList.add('chat__msg--reward');

        const headerEl = document.createElement('div');
        headerEl.className = 'chat__reward-header';
        const costStr = extra.rewardCost ? ` (${extra.rewardCost} pts)` : '';
        const titleStr = extra.rewardTitle ? `: ${extra.rewardTitle}` : '';
        headerEl.textContent = `[ REWARD // ${user}${titleStr}${costStr} ]`;
        msg.append(headerEl);
      } else {
        const userEl = document.createElement('span');
        userEl.className = 'chat__user';

        // Render graphical Twitch badges
        if (extra.badges && extra.badges.length > 0) {
          const badgesEl = document.createElement('span');
          badgesEl.className = 'chat__badges';
          for (const b of extra.badges) {
            const badgeUrl = badgesMap[`${b.set}/${b.version}`] || badgesMap[`${b.set}/1`] || badgesMap[`${b.set}/0`];
            if (badgeUrl) {
              const img = document.createElement('img');
              img.className = 'chat__badge';
              img.src = badgeUrl;
              img.alt = b.set;
              img.title = `${b.set} (${b.version})`;
              badgesEl.append(img);
            }
          }
          if (badgesEl.childNodes.length > 0) {
            userEl.prepend(badgesEl);
          }
        }

        const nameNode = document.createTextNode(user);
        userEl.append(nameNode);
        if (color) userEl.style.color = color;
        msg.append(userEl);
      }

      const contentEl = document.createElement('div');
      contentEl.className = 'chat__content';

      if (cleanText || !mediaUrl) {
        const textEl = document.createElement('span');
        textEl.className = 'chat__text';
        textEl.innerHTML = formatTextWithEmotes(cleanText || rawText, twitchEmotes);
        contentEl.append(textEl);
      }

      if (mediaUrl) {
        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'chat__media';
        const isVideo = /\.(mp4|webm)(\?[^\s]*)?$/i.test(mediaUrl);
        if (isVideo) {
          const video = document.createElement('video');
          video.src = mediaUrl;
          video.autoplay = true;
          video.loop = true;
          video.muted = true;
          video.playsInline = true;
          video.onerror = () => { mediaContainer.classList.add('chat__media--hidden'); };
          mediaContainer.append(video);
        } else {
          const img = document.createElement('img');
          img.src = mediaUrl;
          img.alt = 'media';
          img.loading = 'lazy';
          img.referrerPolicy = 'no-referrer';
          img.onerror = () => { mediaContainer.classList.add('chat__media--hidden'); };
          mediaContainer.append(img);
        }
        contentEl.append(mediaContainer);
      }

      msg.append(contentEl);
      chatBody.append(msg);

      while (chatBody.children.length > maxMessages) {
        chatBody.firstElementChild.remove();
      }
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    const pinnedContainer = document.getElementById('chat-pinned');
    let pollTimerInterval = null;
    let pollDismissTimer = null;
    let predDismissTimer = null;

    function handlePollEvent(data) {
      if (!pinnedContainer) return;
      let pollBox = document.getElementById('pinned-poll');

      if (data.action === 'end' || data.status === 'completed' || data.status === 'terminated') {
        if (!pollBox) return;
        const choicesContainer = pollBox.querySelector('.chat__poll-choices');
        if (choicesContainer && data.choices) {
          const maxVotes = Math.max(...data.choices.map(c => c.votes || 0));
          choicesContainer.querySelectorAll('.chat__poll-choice').forEach((el, idx) => {
            const ch = data.choices[idx];
            if (ch && ch.votes === maxVotes && maxVotes > 0) {
              el.classList.add('is-winner');
            }
          });
        }
        const timerEl = pollBox.querySelector('.chat__poll-timer');
        if (timerEl) timerEl.textContent = '[ ENDED ]';
        if (pollTimerInterval) {
          clearInterval(pollTimerInterval);
          pollTimerInterval = null;
        }

        if (pollDismissTimer) clearTimeout(pollDismissTimer);
        pollDismissTimer = setTimeout(() => {
          if (pollBox) pollBox.remove();
        }, 10000);
        return;
      }

      if (!pollBox) {
        pollBox = document.createElement('div');
        pollBox.id = 'pinned-poll';
        pollBox.className = 'chat__pinned-box chat__pinned-box--poll';
        pinnedContainer.prepend(pollBox);
      }

      const totalVotes = data.totalVotes || (data.choices ? data.choices.reduce((a, b) => a + (b.votes || 0), 0) : 0);
      let endsTimestamp = data.endsAt ? new Date(data.endsAt).getTime() : 0;
      function formatTimer() {
        if (!endsTimestamp) return '';
        const diff = Math.max(0, Math.round((endsTimestamp - Date.now()) / 1000));
        const m = String(Math.floor(diff / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        return `[ ${m}:${s} ]`;
      }

      let choicesHtml = '';
      (data.choices || []).forEach((c, idx) => {
        const pct = c.percent !== undefined ? c.percent : (totalVotes > 0 ? Math.round((c.votes || 0) / totalVotes * 100) : 0);
        choicesHtml += `
          <div class="chat__poll-choice">
            <div class="chat__poll-choice-label">
              <span>${idx + 1}. ${escapeHtml(c.title)}</span>
              <span>${pct}% (${c.votes || 0})</span>
            </div>
            <div class="chat__poll-bar">
              <div class="chat__poll-bar-fill" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      });

      pollBox.innerHTML = `
        <div class="chat__poll-header">
          <span class="chat__poll-title">[ POLL // ${escapeHtml(data.title || 'Vote')} ]</span>
          <span class="chat__poll-timer">${formatTimer()}</span>
        </div>
        <div class="chat__poll-choices">${choicesHtml}</div>
      `;

      if (pollTimerInterval) clearInterval(pollTimerInterval);
      if (endsTimestamp) {
        pollTimerInterval = setInterval(() => {
          const tEl = pollBox.querySelector('.chat__poll-timer');
          if (tEl) {
            tEl.textContent = formatTimer();
          }
        }, 1000);
      }
    }

    function handlePredictionEvent(data) {
      if (!pinnedContainer) return;
      let predBox = document.getElementById('pinned-pred');

      if (data.action === 'end' || data.status === 'resolved' || data.status === 'canceled') {
        if (!predBox) return;
        const statusEl = predBox.querySelector('.chat__pred-status');
        if (statusEl) statusEl.textContent = `[ ${String(data.status).toUpperCase()} ]`;
        
        if (data.winningOutcomeId) {
          predBox.querySelectorAll('.chat__pred-outcome').forEach(el => {
            if (el.dataset.id === data.winningOutcomeId) el.classList.add('is-winner');
          });
        }

        if (predDismissTimer) clearTimeout(predDismissTimer);
        predDismissTimer = setTimeout(() => {
          if (predBox) predBox.remove();
        }, 10000);
        return;
      }

      if (!predBox) {
        predBox = document.createElement('div');
        predBox.id = 'pinned-pred';
        predBox.className = 'chat__pinned-box chat__pinned-box--prediction';
        pinnedContainer.prepend(predBox);
      }

      const totalPoints = data.totalPoints || (data.outcomes ? data.outcomes.reduce((a, b) => a + (b.points || 0), 0) : 0);
      let outcomesHtml = '';
      (data.outcomes || []).forEach((o, idx) => {
        const colorClass = (o.color || (idx === 0 ? 'blue' : 'pink')).toLowerCase();
        const pct = o.percent !== undefined ? o.percent : (totalPoints > 0 ? Math.round((o.points || 0) / totalPoints * 100) : 0);
        outcomesHtml += `
          <div class="chat__pred-outcome chat__pred-outcome--${colorClass}" data-id="${o.id}">
            <div style="display:flex; justify-content:space-between; font-weight:bold;">
              <span>${escapeHtml(o.title)}</span>
              <span>${pct}%</span>
            </div>
            <div style="font-size:10px; color:var(--color-muted);">
              ${o.points ? o.points.toLocaleString() + ' pts' : '0 pts'}
            </div>
          </div>
        `;
      });

      predBox.innerHTML = `
        <div class="chat__pred-header">
          <span class="chat__pred-title">[ PREDICTION // ${escapeHtml(data.title || 'Bet')} ]</span>
          <span class="chat__pred-status">[ ${(data.status || 'ACTIVE').toUpperCase()} ]</span>
        </div>
        <div class="chat__pred-outcomes">${outcomesHtml}</div>
      `;
    }

    const demoMode = params.get('demo');
    if (demoMode) {
      const DEMO_CHAT = [
        ['vokiry', 'welcome everyone to the stream! RainTime', '#63E6BE', [], 'message', { badges: [{ set: 'broadcaster', version: '1' }, { set: 'elden-ring-recluse', version: '1' }] }],
        ['alice', 'hey chat! PogChamp', '#38BDF8', [], 'message', { badges: [{ set: 'moderator', version: '1' }] }],
        ['bob', 'look at this https://media.tenor.com/2l3mQ2s3h38AAAAC/cat-jam.gif LUL', '#F472B6', [], 'message', { badges: [{ set: 'vip', version: '1' }, { set: 'subscriber', version: '12' }] }],
        ['carol', 'hype for the stream! KEKW', '#A78BFA', [], 'message', { badges: [{ set: 'fallout-season-2-ghoul', version: '1' }] }],
        ['dave', 'greetings from berlin', '#E8EEF2', [], 'message', { badges: [{ set: 'borderlands-4-badge---vault-symbol', version: '1' }] }],
      ];
      let i = 0;
      setInterval(() => {
        const item = DEMO_CHAT[i % DEMO_CHAT.length];
        i++;
        addMessage(item[0], item[1], item[2], item[3], item[4], item[5]);
      }, 3500);
    }

    const wsParam = params.get('ws');
    if (wsParam !== 'off') {
      const wsUrl = wsParam || `ws://${location.host || '127.0.0.1:8787'}/events`;
      let retryDelay = 1000;
      const connect = () => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => {
          retryDelay = 1000;
          if (!hasLoadedGlobalEmotes) {
            loadGlobalEmotes();
          }
          if (!hasLoadedTwitchBadges) {
            loadTwitchBadges();
          }
        };
        socket.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.type === 'chat_clear') {
              chatBody.innerHTML = '';
            } else if (data.type === 'chat_history' && Array.isArray(data.messages)) {
              chatBody.innerHTML = '';
              hasLiveMessage = true;
              for (const m of data.messages) {
                if (m && m.user) {
                  addMessage(m.user, m.text || '', m.color, m.emotes, m.subtype || 'message', {
                    announcementColor: m.announcementColor,
                    rewardTitle: m.rewardTitle,
                    rewardCost: m.rewardCost,
                    badges: m.badges
                  });
                }
              }
            } else if (data.type === '7tv_emotes') {
              if (data.cdnBase && !params.get('source')) {
                cdnBase = data.cdnBase;
              }
              if (data.emotes) {
                Object.assign(emotesMap, data.emotes);
                refreshSeedEmotes();
              }
            } else if (data.type === 'twitch_badges' && data.badges) {
              Object.assign(badgesMap, data.badges);
            } else if (data.type === 'poll') {
              handlePollEvent(data);
            } else if (data.type === 'prediction') {
              handlePredictionEvent(data);
            } else if (data.type === 'room_info' && data.roomId) {
              loadChannelEmotes(data.roomId);
            } else if (data.type === 'chat' && data.user) {
              addMessage(data.user, data.text || '', data.color, data.emotes, data.subtype || 'message', {
                announcementColor: data.announcementColor,
                rewardTitle: data.rewardTitle,
                rewardCost: data.rewardCost,
                badges: data.badges
              });
            }
          } catch (e) {}
        };
        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        };
        socket.onerror = () => socket.close();
      };
      connect();
    }
    })();
  </script>
