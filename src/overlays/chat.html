<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — chat</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/chat.css">
</head>
<body>
  <div class="overlay">
    <div class="chat">
      <script>
        (() => {
          const p = new URLSearchParams(location.search);
          const c = document.currentScript.parentElement;
          if (p.get('layout') === 'half') {
            c.classList.add('chat--half');
            c.dataset.layout = 'half';
          }
          if (p.get('pos') === 'main-right') {
            c.classList.add('chat--main-sidebar');
          }
        })();
      </script>
      <div class="chat__header">chat</div>
      <div class="chat__pinned-container" id="chat-pinned"></div>
      <div class="chat__body"></div>
    </div>
  </div>
  <script src="overlay.js"></script>
  <script src="../components/chat.js"></script>
</body>
</html>
