<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — chat</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/chat.css">
</head>
<body>
  <div class="overlay">
    <div class="chat">
      <div class="chat__header">chat</div>
      <div class="chat__body">
        <div class="chat__msg">
          <span class="chat__user">alice</span>
          <span class="chat__text">gl hf!</span>
        </div>
        <div class="chat__msg">
          <span class="chat__user">bob</span>
          <span class="chat__text">that intro was sick</span>
        </div>
        <div class="chat__msg">
          <span class="chat__user">carol</span>
          <span class="chat__text">what's the next game?</span>
        </div>
      </div>
    </div>
  </div>
  <script src="overlay.js"></script>
  <script>
    (() => {
    const params = new URLSearchParams(location.search);
    const chatBody = document.querySelector('.chat__body');
    const maxMessages = parseInt(params.get('max'), 10) || 20;
    let hasLiveMessage = false;

    function get7TvEmoteUrl(id) {
      return `https://enhanced.jeetbot.cc/https://cdn.7tv.app/emote/${id}/2x.webp`;
    }

    const SEED_EMOTES = {
      // 7TV popular globals (using JeetBot anti-block proxy)
      RainTime: get7TvEmoteUrl('01FCY771D800007PQ2DF3GDTN6'),
      catJAM: get7TvEmoteUrl('01F00YT2CR0007E4VV006YKSK6'),
      KEKW: get7TvEmoteUrl('01FCY771D800007PQ2DF3GDTN6'),
      peepoHappy: get7TvEmoteUrl('60ae3e542597b2219c9b46c6'),
      OMEGALUL: get7TvEmoteUrl('60abf171870d317bef23d399'),
      // Twitch native popular globals
      Kappa: 'https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/2.0',
      LUL: 'https://static-cdn.jtvnw.net/emoticons/v2/425618/default/dark/2.0',
      PogChamp: 'https://static-cdn.jtvnw.net/emoticons/v2/305954156/default/dark/2.0',
      BibleThump: 'https://static-cdn.jtvnw.net/emoticons/v2/86/default/dark/2.0',
      Kreygasm: 'https://static-cdn.jtvnw.net/emoticons/v2/41/default/dark/2.0',
      VoHiYo: 'https://static-cdn.jtvnw.net/emoticons/v2/81274/default/dark/2.0',
      HeyGuys: 'https://static-cdn.jtvnw.net/emoticons/v2/30259/default/dark/2.0',
      WutFace: 'https://static-cdn.jtvnw.net/emoticons/v2/28087/default/dark/2.0',
      NotLikeThis: 'https://static-cdn.jtvnw.net/emoticons/v2/58765/default/dark/2.0',
      ResidentSleeper: 'https://static-cdn.jtvnw.net/emoticons/v2/245/default/dark/2.0',
    };
    const emotesMap = { ...SEED_EMOTES };

    const chatEl = document.querySelector('.chat');
    if (params.get('width') && chatEl) chatEl.style.width = params.get('width') + 'px';
    if (params.get('height') && chatEl) chatEl.style.height = params.get('height') + 'px';

    async function loadGlobalEmotes() {
      const urls = [
        'https://enhanced.jeetbot.cc/https://7tv.io/v3/emote-sets/global',
        'https://7tv.io/v3/emote-sets/global'
      ];
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const data = await resp.json();
            for (const emote of data.emotes || []) {
              if (emote.id && emote.name) {
                emotesMap[emote.name] = get7TvEmoteUrl(emote.id);
              }
            }
            break;
          }
        } catch (e) {}
      }
    }
    loadGlobalEmotes();

    async function loadChannelEmotes(roomId) {
      if (!roomId) return;
      const urls = [
        `https://enhanced.jeetbot.cc/https://7tv.io/v3/users/twitch/${encodeURIComponent(roomId)}`,
        `https://7tv.io/v3/users/twitch/${encodeURIComponent(roomId)}`
      ];
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const data = await resp.json();
            for (const emote of (data.emote_set?.emotes || [])) {
              if (emote.id && emote.name) {
                emotesMap[emote.name] = get7TvEmoteUrl(emote.id);
              }
            }
            break;
          }
        } catch (e) {}
      }
    }

    if (params.get('room')) {
      loadChannelEmotes(params.get('room'));
    }

    // Media allowlist: JeetBot/PicDrisnya upload domains, Tenor, Giphy, Imgur
    const ALLOWED_MEDIA_REGEX = /(https?:\/\/(?:[a-zA-Z0-9-]+\.)*drisnya\.online\/[^\s]+|https?:\/\/(?:[a-zA-Z0-9-]+\.)*tenor\.com\/[^\s]+|https?:\/\/(?:[a-zA-Z0-9-]+\.)*giphy\.com\/[^\s]+|https?:\/\/(?:[a-zA-Z0-9-]+\.)*imgur\.com\/[^\s]+)/i;

    function extractMedia(text) {
      const match = text.match(ALLOWED_MEDIA_REGEX);
      if (!match) return { cleanText: text, mediaUrl: null };
      let mediaUrl = match[1].replace(/[.,!?;:)\"]+$/, "");
      const cleanText = text.replace(match[1], '').replace(/\s+/g, ' ').trim();
      return { cleanText, mediaUrl };
    }

    async function resolveMediaUrl(rawUrl) {
      if (!rawUrl) return null;
      const postMatch = rawUrl.match(/https?:\/\/(?:[a-zA-Z0-9-]+\.)*drisnya\.online\/post\/([A-Za-z0-9_-]+)/i);
      if (postMatch) {
        const slug = postMatch[1];
        try {
          const res = await fetch(`https://img.drisnya.online/api/posts/${encodeURIComponent(slug)}`);
          if (res.ok) {
            const payload = await res.json();
            const media = Array.isArray(payload.media) ? payload.media[0] : null;
            if (media) {
              const cdn = (payload.cdnBase || '').replace(/\/+$/, '');
              const file = (media.filePath || media.thumbnailPath || '').replace(/^\/+/, '');
              if (cdn && file) return `${cdn}/${file}`;
            }
          }
        } catch (e) {}
      }
      return rawUrl;
    }

    function formatTextWithEmotes(text, twitchEmotes = []) {
      if (!text) return '';

      // 1. Process native Twitch emotes by character slice ranges if provided from IRC
      let tokens = [text];
      if (twitchEmotes && twitchEmotes.length > 0) {
        const sorted = [...twitchEmotes].sort((a, b) => b.start - a.start);
        let cur = text;
        for (const e of sorted) {
          if (e.start >= 0 && e.end <= cur.length) {
            const before = cur.slice(0, e.start);
            const after = cur.slice(e.end);
            const img = `<img class="chat__emote" src="${e.url}" alt="emote">`;
            cur = before + '\uFFF0' + img + '\uFFF1' + after;
          }
        }
        tokens = cur.split(/(\uFFF0[^\uFFF1]+\uFFF1)/);
      }

      // 2. Process remaining text chunks for 7TV & global seed emotes, safely escaping HTML
      const htmlParts = [];
      for (const token of tokens) {
        if (token.startsWith('\uFFF0') && token.endsWith('\uFFF1')) {
          htmlParts.push(token.slice(1, -1));
        } else {
          const words = token.split(' ');
          const formattedWords = words.map(w => {
            if (emotesMap[w]) {
              return `<img class="chat__emote" src="${emotesMap[w]}" alt="${w}" title="${w}">`;
            }
            return w.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          });
          htmlParts.push(formattedWords.join(' '));
        }
      }
      return htmlParts.join('');
    }

    async function addMessage(user, rawText, color, twitchEmotes = []) {
      if (!chatBody) return;
      if (!hasLiveMessage) {
        chatBody.innerHTML = '';
        hasLiveMessage = true;
      }

      const { cleanText, mediaUrl: rawMediaUrl } = extractMedia(rawText || '');
      const mediaUrl = rawMediaUrl ? await resolveMediaUrl(rawMediaUrl) : null;

      const msg = document.createElement('div');
      msg.className = 'chat__msg';

      const userEl = document.createElement('span');
      userEl.className = 'chat__user';
      userEl.textContent = user;
      if (color) userEl.style.color = color;

      const contentEl = document.createElement('div');
      contentEl.className = 'chat__content';

      if (cleanText || !mediaUrl) {
        const textEl = document.createElement('span');
        textEl.className = 'chat__text';
        textEl.innerHTML = formatTextWithEmotes(cleanText || rawText, twitchEmotes);
        contentEl.append(textEl);
      }

      if (mediaUrl) {
        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'chat__media';
        const isVideo = /\.(mp4|webm)(\?[^\s]*)?$/i.test(mediaUrl);
        if (isVideo) {
          const video = document.createElement('video');
          video.src = mediaUrl;
          video.autoplay = true;
          video.loop = true;
          video.muted = true;
          video.playsInline = true;
          video.onerror = () => { mediaContainer.classList.add('chat__media--hidden'); };
          mediaContainer.append(video);
        } else {
          const img = document.createElement('img');
          img.src = mediaUrl;
          img.alt = 'media';
          img.loading = 'lazy';
          img.referrerPolicy = 'no-referrer';
          img.onerror = () => { mediaContainer.classList.add('chat__media--hidden'); };
          mediaContainer.append(img);
        }
        contentEl.append(mediaContainer);
      }

      msg.append(userEl, contentEl);
      chatBody.append(msg);

      while (chatBody.children.length > maxMessages) {
        chatBody.firstElementChild.remove();
      }
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    const demoMode = params.get('demo');
    if (demoMode) {
      const DEMO_CHAT = [
        ['alice', 'lets goooo! RainTime Kappa'],
        ['bob', 'look at this https://media.tenor.com/2l3mQ2s3h38AAAAC/cat-jam.gif LUL'],
        ['carol', 'hype for the stream! PogChamp'],
        ['dave', 'greetings from berlin'],
        ['erin', 'system24 aesthetic is amazing VoHiYo'],
      ];
      let i = 0;
      setInterval(() => {
        const [u, t] = DEMO_CHAT[i % DEMO_CHAT.length];
        i++;
        addMessage(u, t);
      }, 3500);
    }

    const wsParam = params.get('ws');
    if (wsParam !== 'off') {
      const wsUrl = wsParam || `ws://${location.host || '127.0.0.1:8787'}/events`;
      let retryDelay = 1000;
      const connect = () => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => { retryDelay = 1000; };
        socket.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.type === 'chat_clear') {
              chatBody.innerHTML = '';
            } else if (data.type === '7tv_emotes' && data.emotes) {
              Object.assign(emotesMap, data.emotes);
            } else if (data.type === 'room_info' && data.roomId) {
              loadChannelEmotes(data.roomId);
            } else if (data.type === 'chat' && data.user) {
              addMessage(data.user, data.text || '', data.color, data.emotes);
            }
          } catch (e) {}
        };
        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        };
        socket.onerror = () => socket.close();
      };
      connect();
    }
    })();
  </script>
</body>
</html>
