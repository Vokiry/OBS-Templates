<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — chat</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/chat.css">
</head>
<body>
  <div class="overlay">
    <div class="chat">
      <div class="chat__header">chat</div>
      <div class="chat__body">
        <div class="chat__msg">
          <span class="chat__user">alice</span>
          <span class="chat__text">gl hf!</span>
        </div>
        <div class="chat__msg">
          <span class="chat__user">bob</span>
          <span class="chat__text">that intro was sick</span>
        </div>
        <div class="chat__msg">
          <span class="chat__user">carol</span>
          <span class="chat__text">what's the next game?</span>
        </div>
      </div>
    </div>
  </div>
  <script src="overlay.js"></script>
  <script>
    (() => {
    const params = new URLSearchParams(location.search);
    const chatBody = document.querySelector('.chat__body');
    const maxMessages = parseInt(params.get('max'), 10) || 20;
    let hasLiveMessage = false;

    const emotesMap = {};

    async function loadGlobalEmotes() {
      try {
        const resp = await fetch('https://7tv.io/v3/emote-sets/global');
        if (resp.ok) {
          const data = await resp.json();
          for (const emote of data.emotes || []) {
            const hostUrl = emote.data?.host?.url;
            if (hostUrl) {
              const url = (hostUrl.startsWith('//') ? 'https:' : '') + hostUrl + '/2x.webp';
              emotesMap[emote.name] = url;
            }
          }
        }
      } catch (e) {}
    }
    loadGlobalEmotes();

    async function loadChannelEmotes(roomId) {
      if (!roomId) return;
      try {
        const resp = await fetch(`https://7tv.io/v3/users/twitch/${encodeURIComponent(roomId)}`);
        if (resp.ok) {
          const data = await resp.json();
          for (const emote of data.emote_set?.emotes || []) {
            const hostUrl = emote.data?.host?.url;
            if (hostUrl) {
              const url = (hostUrl.startsWith('//') ? 'https:' : '') + hostUrl + '/2x.webp';
              emotesMap[emote.name] = url;
            }
          }
        }
      } catch (e) {}
    }

    if (params.get('room')) {
      loadChannelEmotes(params.get('room'));
    }

    // Strict media allowlist: only JeetBot extension upload server and verified major GIF/image platforms
    const ALLOWED_MEDIA_REGEX = /(https?:\/\/(?:img\.drisnya\.online|media\.tenor\.com|c\.tenor\.com|i\.imgur\.com|(?:media[0-9]*|i)\.giphy\.com)\/[^\s]+)/i;

    function extractMedia(text) {
      const match = text.match(ALLOWED_MEDIA_REGEX);
      if (!match) return { cleanText: text, mediaUrl: null };
      const mediaUrl = match[1];
      const cleanText = text.replace(mediaUrl, '').replace(/\s+/g, ' ').trim();
      return { cleanText, mediaUrl };
    }

    function formatTextWithEmotes(text) {
      if (!text) return '';
      const words = text.split(' ');
      const htmlParts = [];
      for (const word of words) {
        if (emotesMap[word]) {
          htmlParts.push(`<img class="chat__emote" src="${emotesMap[word]}" alt="${word}" title="${word}">`);
        } else {
          const escaped = word.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          htmlParts.push(escaped);
        }
      }
      return htmlParts.join(' ');
    }

    function addMessage(user, rawText, color) {
      if (!chatBody) return;
      if (!hasLiveMessage) {
        chatBody.innerHTML = '';
        hasLiveMessage = true;
      }

      const { cleanText, mediaUrl } = extractMedia(rawText || '');

      const msg = document.createElement('div');
      msg.className = 'chat__msg';

      const userEl = document.createElement('span');
      userEl.className = 'chat__user';
      userEl.textContent = user;
      if (color) userEl.style.color = color;

      const contentEl = document.createElement('div');
      contentEl.className = 'chat__content';

      if (cleanText || !mediaUrl) {
        const textEl = document.createElement('span');
        textEl.className = 'chat__text';
        textEl.innerHTML = formatTextWithEmotes(cleanText || rawText);
        contentEl.append(textEl);
      }

      if (mediaUrl) {
        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'chat__media';
        const img = document.createElement('img');
        img.src = mediaUrl;
        img.alt = 'media';
        img.loading = 'lazy';
        img.onerror = () => mediaContainer.remove();
        mediaContainer.append(img);
        contentEl.append(mediaContainer);
      }

      msg.append(userEl, contentEl);
      chatBody.append(msg);

      while (chatBody.children.length > maxMessages) {
        chatBody.firstElementChild.remove();
      }
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    const demoMode = params.get('demo');
    if (demoMode) {
      const DEMO_CHAT = [
        ['alice', 'lets goooo! RainTime'],
        ['bob', 'check this out https://media.tenor.com/2l3mQ2s3h38AAAAC/cat-jam.gif'],
        ['carol', 'hype for the stream!'],
        ['dave', 'greetings from berlin'],
        ['erin', 'system24 aesthetic is amazing'],
      ];
      let i = 0;
      setInterval(() => {
        const [u, t] = DEMO_CHAT[i % DEMO_CHAT.length];
        i++;
        addMessage(u, t);
      }, 3500);
    }

    const wsParam = params.get('ws');
    if (wsParam !== 'off') {
      const wsUrl = wsParam || 'ws://127.0.0.1:8787/events';
      let retryDelay = 1000;
      const connect = () => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => { retryDelay = 1000; };
        socket.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.type === '7tv_emotes' && data.emotes) {
              Object.assign(emotesMap, data.emotes);
            } else if (data.type === 'room_info' && data.roomId) {
              loadChannelEmotes(data.roomId);
            } else if (data.type === 'chat' && data.user) {
              addMessage(data.user, data.text || '', data.color);
            }
          } catch (e) {}
        };
        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        };
        socket.onerror = () => socket.close();
      };
      connect();
    }
    })();
  </script>
</body>
</html>
