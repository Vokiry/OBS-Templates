<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — media request</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <style>
    .media-card {
      display: none;
      width: 480px;
      max-width: 100%;
      background: var(--color-overlay);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-panel);
      padding: var(--space-3);
      font-family: var(--font-interface);
      box-sizing: border-box;
      transition: border-color var(--border-hover-transition);
    }

    .media-card.is-active {
      display: block;
      animation: fadeIn var(--anim-normal) var(--anim-ease);
    }

    .media-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--text-xs);
      font-weight: var(--text-weight-medium);
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: var(--letter-spacing-mono);
      margin-bottom: var(--space-2);
    }

    .media-card__title {
      color: var(--color-accent);
    }

    .media-card__donor {
      color: var(--color-text);
      font-weight: var(--text-weight-bold);
    }

    .media-card__queue {
      font-size: 10px;
      padding: 1px 6px;
      background: rgba(99, 230, 190, 0.15);
      border: 1px solid var(--color-accent);
      color: var(--color-accent);
      margin-left: var(--space-2);
    }

    .media-card__player {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border: 1px solid var(--color-border-faint);
      overflow: hidden;
      margin-bottom: var(--space-2);
    }

    .media-card__player-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .media-card__info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .media-card__message {
      font-size: var(--text-sm);
      color: var(--color-text);
      line-height: 1.4;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .media-card__status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--color-muted);
      border-top: 1px dashed var(--color-border-faint);
      padding-top: 4px;
      margin-top: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="media-card" id="media-card">
      <div class="media-card__header">
        <span class="media-card__title">
          [ MEDIA // <span class="media-card__donor" id="media-donor">viewer</span> ]
        </span>
        <span class="media-card__queue" id="media-queue" style="display: none;">queue [ 0 ]</span>
      </div>

      <div class="media-card__player">
        <div class="media-card__player-inner" id="yt-player-container"></div>
      </div>

      <div class="media-card__info">
        <div class="media-card__message" id="media-message" style="display: none;"></div>
        <div class="media-card__status">
          <span id="media-track-title">YouTube Track</span>
          <span id="media-duration">PLAYING</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="overlay.js"></script>
  <script src="../components/media-request.js"></script>
</body>
</html>
