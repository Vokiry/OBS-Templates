<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>SYSTEM — Now Playing & Lyrics</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/now-playing.css">
</head>
<body>
  <div class="overlay">
    <div class="now-playing is-hidden" id="np-card">
      <!-- Header -->
      <div class="np-header">
        <span class="np-player-tag" id="np-player">[ NOW PLAYING // MEDIA ]</span>
        <span class="np-status-tag is-playing" id="np-status">PLAYING</span>
      </div>

      <!-- Main Track Row -->
      <div class="np-body">
        <div class="np-cover-wrap" id="np-cover-box">
          <img class="np-cover-img" id="np-cover" alt="Album Art">
          <div class="np-cover-fallback" id="np-fallback">[ NO<br>ART ]</div>
        </div>
        <div class="np-meta">
          <div class="np-title" id="np-title">Waiting for audio...</div>
          <div class="np-artist" id="np-artist">—</div>
          <div class="np-album" id="np-album"></div>
        </div>
      </div>

      <!-- Timeline & ASCII Progress Bar -->
      <div class="np-timeline" id="np-timeline">
        <span class="np-ascii-bar" id="np-bar">[--------------------]</span>
        <span class="np-time" id="np-time">00:00 / 00:00</span>
      </div>

      <!-- Synchronized Lyrics Teleprompter -->
      <div class="np-lyrics-box" id="np-lyrics-box" style="display: none;">
        <div class="np-lyrics-header">[ LYRICS // SYNCHRONIZED ]</div>
        <div class="np-lyrics-viewport" id="np-lyrics-viewport">
          <div class="np-lyrics-stream" id="np-lyrics-stream"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const card = document.getElementById('np-card');
      const playerEl = document.getElementById('np-player');
      const statusEl = document.getElementById('np-status');
      const coverEl = document.getElementById('np-cover');
      const fallbackEl = document.getElementById('np-fallback');
      const titleEl = document.getElementById('np-title');
      const artistEl = document.getElementById('np-artist');
      const albumEl = document.getElementById('np-album');
      const barEl = document.getElementById('np-bar');
      const timeEl = document.getElementById('np-time');
      const lyricsBox = document.getElementById('np-lyrics-box');
      const lyricsStream = document.getElementById('np-lyrics-stream');

      // Variant styling
      const variant = params.get('variant') || 'full'; // 'compact' | 'full' | 'starting-soon'
      if (variant === 'compact') card.classList.add('np--compact');
      if (variant === 'starting-soon') card.classList.add('np--starting-soon');

      const showCover = params.get('cover') !== '0';
      if (!showCover) card.classList.add('np--no-cover');

      const BAR_WIDTH = parseInt(params.get('bar'), 10) || (variant === 'compact' ? 14 : 24);
      const lyricsMode = params.get('lyrics') || (variant === 'starting-soon' ? 'always' : 'auto'); // 'always' | 'auto' | 'starting' | 'off'
      const autohideSec = params.has('autohide') ? parseFloat(params.get('autohide')) : 8;

      const LINE_HEIGHT = variant === 'starting-soon' ? 34 : 28; // px per line

      let state = {
        available: false,
        player: 'media',
        status: 'Stopped',
        title: '',
        artist: '',
        album: '',
        position_ms: 0,
        duration_ms: null,
        has_cover: false,
        cover_url: '',
        source: 'local'
      };

      let currentLyrics = {
        instrumental: false,
        has_synced: false,
        lines: [] // [{t: ms, text: ''}, ...]
      };

      let systemBroadcastState = 'live';
      let lastPacketTime = performance.now();
      let hideTimeout = null;
      let lastActiveIdx = -1;

      function formatTime(ms) {
        if (ms == null || isNaN(ms)) return '--:--';
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function renderAsciiBar(currMs, totalMs) {
        if (!totalMs || totalMs <= 0) {
          // Streaming or live track: animated marquee
          const tick = Math.floor((performance.now() / 250) % BAR_WIDTH);
          let bar = '[';
          for (let i = 0; i < BAR_WIDTH; i++) {
            bar += (i === tick || i === (tick + 1) % BAR_WIDTH) ? '#' : '-';
          }
          return bar + ']';
        }
        const pct = Math.max(0, Math.min(1, currMs / totalMs));
        const filled = Math.round(pct * BAR_WIDTH);
        const empty = Math.max(0, BAR_WIDTH - filled);
        return `[${'#'.repeat(filled)}${'-'.repeat(empty)}]`;
      }

      function updateCardVisibility() {
        if (state.available && state.status === 'Playing' && state.title) {
          // Track is actively playing -> show immediately and cancel any hide timers
          if (hideTimeout) {
            clearTimeout(hideTimeout);
            hideTimeout = null;
          }
          card.classList.remove('is-hidden');
        } else if (state.available && state.status === 'Paused') {
          // Track is paused -> auto-hide after autohideSec (default 8s)
          if (autohideSec > 0) {
            if (!hideTimeout && !card.classList.contains('is-hidden')) {
              hideTimeout = setTimeout(() => {
                card.classList.add('is-hidden');
                hideTimeout = null;
              }, autohideSec * 1000);
            }
          }
        } else {
          // Track stopped, unavailable, or empty -> hide after 2s debounce
          if (!hideTimeout && !card.classList.contains('is-hidden')) {
            hideTimeout = setTimeout(() => {
              card.classList.add('is-hidden');
              hideTimeout = null;
            }, 2000);
          }
        }
      }

      function updateCover(coverUrl, hasCover) {
        if (hasCover && coverUrl) {
          coverEl.src = coverUrl;
          coverEl.style.display = 'block';
          fallbackEl.style.display = 'none';
        } else {
          coverEl.style.display = 'none';
          fallbackEl.style.display = 'block';
        }
      }

      function shouldShowLyrics() {
        if (lyricsMode === 'off' || variant === 'compact') return false;
        if (lyricsMode === 'always' || variant === 'starting-soon') return true;
        if (lyricsMode === 'starting') return systemBroadcastState === 'starting';
        return currentLyrics.has_synced || currentLyrics.instrumental;
      }

      function buildLyricsStreamDOM() {
        lyricsStream.innerHTML = '';
        lastActiveIdx = -1;

        if (currentLyrics.instrumental) {
          lyricsStream.innerHTML = '<div class="np-lyric-instrumental">♪ [ INSTRUMENTAL — NO VOCALS ] ♪</div>';
          lyricsStream.style.transform = 'translateY(0)';
          return;
        }

        const lines = currentLyrics.lines || [];
        if (lines.length === 0) {
          lyricsStream.innerHTML = '<div class="np-lyric-instrumental">[ NO SYNCHRONIZED LYRICS ]</div>';
          lyricsStream.style.transform = 'translateY(0)';
          return;
        }

        // Build rolling list of pure lyric lines (NO timestamps)
        const frag = document.createDocumentFragment();
        lines.forEach((line, idx) => {
          const div = document.createElement('div');
          div.className = 'np-lyric-line is-future';
          div.id = `np-l-${idx}`;
          div.textContent = line.text;
          frag.appendChild(div);
        });
        lyricsStream.appendChild(frag);
      }

      function updateLyricsScroll(currMs) {
        if (!shouldShowLyrics()) {
          lyricsBox.style.display = 'none';
          return;
        }

        lyricsBox.style.display = 'flex';

        if (currentLyrics.instrumental || !currentLyrics.lines || currentLyrics.lines.length === 0) {
          return;
        }

        const lines = currentLyrics.lines;

        // Binary search for active lyric cue
        let low = 0;
        let high = lines.length - 1;
        let activeIdx = -1;

        while (low <= high) {
          const mid = (low + high) >> 1;
          if (lines[mid].t <= currMs) {
            activeIdx = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        if (activeIdx !== lastActiveIdx) {
          lastActiveIdx = activeIdx;

          // Update active/past/future classes
          const lineElements = lyricsStream.children;
          for (let i = 0; i < lineElements.length; i++) {
            const el = lineElements[i];
            if (i < activeIdx) {
              el.className = 'np-lyric-line is-past';
            } else if (i === activeIdx) {
              el.className = 'np-lyric-line is-active';
            } else {
              el.className = 'np-lyric-line is-future';
            }
          }

          // Smooth teleprompter roll: center active line around row 2 (56px offset)
          const targetY = Math.max(0, (activeIdx * LINE_HEIGHT) - (LINE_HEIGHT * 2));
          lyricsStream.style.transform = `translateY(-${targetY}px)`;
        }
      }

      // Smooth 60fps ticker loop using performance.now()
      function animationTick() {
        if (state.available && state.status !== 'Stopped') {
          const now = performance.now();
          const elapsed = (state.status === 'Playing') ? (now - lastPacketTime) : 0;
          const currentPosMs = Math.max(0, state.position_ms + elapsed);

          barEl.textContent = renderAsciiBar(currentPosMs, state.duration_ms);
          if (state.duration_ms) {
            timeEl.textContent = `${formatTime(currentPosMs)} / ${formatTime(state.duration_ms)}`;
          } else {
            timeEl.textContent = `${formatTime(currentPosMs)} / [LIVE]`;
          }

          updateLyricsScroll(currentPosMs);
        }
        requestAnimationFrame(animationTick);
      }
      requestAnimationFrame(animationTick);

      // Handle server updates
      function applyNowPlaying(payload) {
        Object.assign(state, payload);
        lastPacketTime = performance.now();

        playerEl.textContent = `[ NOW PLAYING // ${state.player.toUpperCase()} ]`;
        titleEl.textContent = state.title || 'Unknown Track';
        artistEl.textContent = state.artist || '—';
        albumEl.textContent = state.album || '';
        albumEl.style.display = state.album ? 'block' : 'none';

        statusEl.className = 'np-status-tag';
        if (state.source === 'donatex' || state.source === 'channel_points') {
          statusEl.classList.add('is-request');
          statusEl.textContent = 'ORDERED';
        } else if (state.status === 'Playing') {
          statusEl.classList.add('is-playing');
          statusEl.textContent = 'PLAYING';
        } else {
          statusEl.classList.add('is-paused');
          statusEl.textContent = 'PAUSED';
        }

        updateCover(state.cover_url, state.has_cover);
        updateCardVisibility();
      }

      function applyLyrics(payload) {
        currentLyrics = {
          instrumental: payload.instrumental === true || payload.instrumental === 'true',
          has_synced: payload.has_synced === true || payload.has_synced === 'true',
          lines: payload.lines || []
        };
        buildLyricsStreamDOM();
      }

      // Mock preview mode (?ws=off)
      if (params.get('ws') === 'off') {
        applyNowPlaying({
          available: true,
          player: 'vlc',
          status: 'Playing',
          title: 'Numb',
          artist: 'Linkin Park',
          album: 'Meteora',
          position_ms: 21500,
          duration_ms: 186000,
          has_cover: false,
          cover_url: ''
        });
        applyLyrics({
          instrumental: false,
          has_synced: true,
          lines: [
            { t: 10000, text: "I'm tired of being what you want me to be" },
            { t: 15000, text: "Feeling so faithless, lost under the surface" },
            { t: 21500, text: "Don't know what you're expecting of me" },
            { t: 26000, text: "Put under the pressure of walking in your shoes" },
            { t: 31000, text: "Every step that I take is another mistake to you" },
            { t: 36000, text: "I've become so numb, I can't feel you there" },
            { t: 42000, text: "Become so tired, so much more aware" }
          ]
        });
        return;
      }

      // Live WebSocket connection
      const wsUrl = `ws://${location.host || '127.0.0.1:8787'}/events`;
      let retryDelay = 1000;

      function connect() {
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          retryDelay = 1000;
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'now_playing') {
              applyNowPlaying(data);
            } else if (data.type === 'lyrics_update') {
              applyLyrics(data);
            } else if (data.type === 'status') {
              systemBroadcastState = data.state || 'live';
            } else if (data.type === 'media_mode') {
              if (data.mode === 'request' && data.request) {
                applyNowPlaying({
                  available: true,
                  player: 'donatex',
                  status: 'Playing',
                  title: data.request.title || 'YouTube Track',
                  artist: `Ordered by ${data.request.user || 'viewer'}`,
                  album: data.request.amount ? `Donation: ${data.request.amount}` : '',
                  position_ms: 0,
                  duration_ms: null,
                  has_cover: false,
                  cover_url: '',
                  source: 'donatex'
                });
              }
            }
          } catch (e) {
            console.debug('WS parse error:', e);
          }
        };

        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 1.5, 5000);
        };
      }

      connect();
    })();
  </script>
</body>
</html>
