<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — now playing</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/now-playing.css">
</head>
<body>
  <div class="overlay">
    <div class="now-playing" data-variant="compact">
      <div class="now-playing__cover"></div>
      <div class="now-playing__meta">
        <span class="now-playing__title">--</span>
        <span class="now-playing__artist">--</span>
        <span class="now-playing__album">--</span>
        <div class="now-playing__row">
          <span id="np-pos">00:00</span>
          <span id="np-len">00:00</span>
        </div>
        <div class="now-playing__progress">
          <div class="now-playing__progress-bar" style="width: 0%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
  <script>
    (() => {
    const params = new URLSearchParams(location.search);
    const variant = params.get('variant') || 'compact';
    const cardEl = document.querySelector('.now-playing');
    cardEl.dataset.variant = variant;

    if (variant === 'expanded' && !params.get('pos')) {
      document.querySelector('.overlay').classList.add('overlay--center');
    }

    const titleEl = document.querySelector('.now-playing__title');
    const artistEl = document.querySelector('.now-playing__artist');
    const albumEl = document.querySelector('.now-playing__album');
    const coverEl = document.querySelector('.now-playing__cover');
    const posEl = document.getElementById('np-pos');
    const lenEl = document.getElementById('np-len');
    const barEl = document.querySelector('.now-playing__progress-bar');

    let currentArtUrl = null;

    if (params.has('always')) {
      cardEl.classList.add('is-active');
    }

    function updateTrack(data) {
      if (!data || !data.active || data.status === 'Stopped') {
        if (!params.has('always')) {
          cardEl.classList.remove('is-active');
        }
        return;
      }

      cardEl.classList.add('is-active');
      titleEl.textContent = data.title || 'Unknown Track';
      artistEl.textContent = data.artist || 'Unknown Artist';
      albumEl.textContent = data.album || '';
      posEl.textContent = data.positionFormatted || '00:00';
      lenEl.textContent = data.lengthFormatted || '00:00';
      barEl.style.width = Math.round((data.progress || 0) * 100) + '%';

      if (data.hasCover && data.artUrl) {
        if (currentArtUrl !== data.artUrl) {
          currentArtUrl = data.artUrl;
          coverEl.innerHTML = `<img src="${data.artUrl}?t=${Date.now()}" alt="cover">`;
        }
      } else {
        currentArtUrl = null;
        coverEl.innerHTML = '';
      }
    }

    // Demo simulation mode (?demo=1)
    if (params.has('demo')) {
      cardEl.classList.add('is-active');
      titleEl.textContent = 'Around the Fur';
      artistEl.textContent = 'Deftones';
      albumEl.textContent = 'Around the Fur';
      posEl.textContent = '01:24';
      lenEl.textContent = '03:31';
      barEl.style.width = '40%';
    }

    const wsParam = params.get('ws');
    if (wsParam !== 'off') {
      const wsUrl = wsParam || `ws://${location.host || '127.0.0.1:8787'}/events`;
      let retryDelay = 1000;
      const connect = () => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => { retryDelay = 1000; };
        socket.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.type === 'now_playing') {
              updateTrack(data);
            }
          } catch (e) {}
        };
        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        };
        socket.onerror = () => socket.close();
      };
      connect();
    }
    })();
  </script>
</body>
</html>
