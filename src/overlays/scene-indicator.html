<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — scene indicator</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/overlay.css">
  <link rel="stylesheet" href="../components/scene-indicator.css">
</head>
<body>
  <div class="overlay">
    <span class="scene-indicator" data-state="main">
      <span class="scene-indicator__dot"></span>
      <span class="scene-indicator__value">LIVE / MAIN</span>
    </span>
  </div>
  <script>
    (() => {
    const STATES = {
      offline: 'SYSTEM OFFLINE',
      starting: 'STARTING SOON',
      intro: 'INTRO / NOW PLAYING',
      main: 'LIVE / MAIN',
      chatting: 'LIVE / CHAT',
      focus: 'LIVE / FOCUS',
      brb: 'PAUSED / BRB',
      ending: 'ENDING',
    };
    const state = new URLSearchParams(location.search).get('state') || 'main';
    const el = document.querySelector('.scene-indicator');
    el.dataset.state = state;
    el.querySelector('.scene-indicator__value').textContent = STATES[state] || state;

    const wsParam = new URLSearchParams(location.search).get('ws');
    if (wsParam !== 'off') {
      const wsUrl = wsParam || `ws://${location.host || '127.0.0.1:8787'}/events`;
      let retryDelay = 1000;
      const connect = () => {
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => { retryDelay = 1000; };
        socket.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.type === 'status' && data.state) {
              const s = data.state.toLowerCase();
              el.dataset.state = s;
              el.querySelector('.scene-indicator__value').textContent = STATES[s] || s.toUpperCase();
            }
          } catch (e) {}
        };
        socket.onclose = () => {
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        };
        socket.onerror = () => socket.close();
      };
      connect();
    }
    })();
  </script>
  <script src="overlay.js"></script>
</body>
</html>
