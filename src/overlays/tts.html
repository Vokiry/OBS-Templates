<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM // TTS</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../components/tts.css">
  <script src="overlay.js"></script>
</head>
<body>
  <div class="tts-card" id="tts-card">
    <div class="tts-card__header">
      <span class="tts-card__tag">TTS</span>
      <span class="tts-card__user" id="tts-user"></span>
    </div>
    <div class="tts-card__body" id="tts-text"></div>
  </div>

  <script>
    const WS_URL = `ws://${location.host}/events`;
    const queue = [];
    let isPlaying = false;
    let currentAudio = null;
    let currentObjectUrl = null;
    let currentStartTimer = null;
    let playbackGeneration = 0;

    function connectWS() {
      const ws = new WebSocket(WS_URL);
      ws.onmessage = event => {
        let data;
        try { data = JSON.parse(event.data); } catch { return; }
        if (data.type === 'tts_speak') {
          queue.push(data);
          if (!isPlaying) playNext();
        } else if (data.type === 'tts_stop') {
          stopAll();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
      ws.onerror = () => ws.close();
    }

    function playNext() {
      if (queue.length === 0) {
        isPlaying = false;
        hideCard();
        return;
      }

      isPlaying = true;
      const generation = playbackGeneration;
      const item = queue.shift();
      if (item.show_card) showCard(item.nickname, item.text);

      const url = URL.createObjectURL(b64toBlob(item.audio_b64, 'audio/ogg'));
      const audio = new Audio();
      currentAudio = audio;
      currentObjectUrl = url;
      audio.preload = 'auto';
      const itemVol = typeof item.volume === 'number' ? item.volume : 0.8;
      audio.volume = Math.max(0, Math.min(1, itemVol));
      audio.src = url;

      let started = false;
      let cleaned = false;
      let startTimer = null;
      const cleanup = () => {
        if (cleaned) return;
        cleaned = true;
        URL.revokeObjectURL(url);
        if (startTimer) clearTimeout(startTimer);
        if (currentAudio === audio) {
          currentAudio = null;
          currentObjectUrl = null;
          hideCard();
        }
        if (generation === playbackGeneration) setTimeout(playNext, 200);
      };
      const startPlayback = () => {
        if (started || generation !== playbackGeneration || currentAudio !== audio) return;
        started = true;
        audio.play().catch(cleanup);
      };

      audio.onended = cleanup;
      audio.onerror = cleanup;
      audio.oncanplay = startPlayback;
      audio.oncanplaythrough = startPlayback;
      startTimer = setTimeout(startPlayback, 80);
      currentStartTimer = startTimer;
    }

    function stopAll() {
      playbackGeneration += 1;
      queue.length = 0;
      if (currentStartTimer) {
        clearTimeout(currentStartTimer);
        currentStartTimer = null;
      }
      if (currentAudio) {
        try {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        } catch (e) {}
        currentAudio = null;
      }
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      isPlaying = false;
      hideCard();
    }

    function showCard(nickname, text) {
      document.getElementById('tts-user').textContent = nickname || '???';
      document.getElementById('tts-text').textContent = text || '';
      document.getElementById('tts-card').classList.add('is-visible');
    }

    function hideCard() {
      document.getElementById('tts-card').classList.remove('is-visible');
    }

    function b64toBlob(b64, type) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type });
    }

    connectWS();
  </script>
</body>
</html>
