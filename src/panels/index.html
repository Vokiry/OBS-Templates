<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — Twitch Panel Constructor</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="panels.css">
</head>
<body>
  <!-- Header -->
  <header class="page-header">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
      <div>
        <div class="page-header__title">SYSTEM // TWITCH PANELS</div>
        <div class="page-header__sub">Multi-format Channel Panel Constructor · 320px width (640px @ 2x Retina) · system24 TUI</div>
      </div>
      <div class="toolbar__group">
        <span style="font-size: 10px; color: #7E8B96; letter-spacing: 0.08em; text-transform: uppercase;">Global Mode:</span>
        <button class="toolbar__btn toolbar__btn--accent" id="global-mode-card" onclick="setGlobalMode('card')">[ ALL CARDS ]</button>
        <button class="toolbar__btn" id="global-mode-banner" onclick="setGlobalMode('banner')">[ ALL BANNERS ]</button>
      </div>
    </div>
  </header>

  <!-- Template & Preset Toolbar -->
  <div class="toolbar">
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('about')">+ ABOUT</button>
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('schedule')">+ SCHEDULE</button>
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('donate')">+ DONATE</button>
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('specs')">+ PC SPECS</button>
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('faq')">+ FAQ / Q&amp;A</button>
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('social')">+ SOCIAL</button>
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('rules')">+ RULES</button>
    <button class="toolbar__btn toolbar__btn--accent" onclick="addPanel('commands')">+ COMMANDS</button>
    <button class="toolbar__btn" onclick="addPanel('custom')">+ EMPTY CUSTOM</button>

    <div style="margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="toolbar__btn" onclick="openMarkdownModal()">[ ⎘ ALL MARKDOWN ]</button>
      <button class="toolbar__btn" onclick="exportConfigJson()">[ EXPORT JSON ]</button>
      <label class="toolbar__btn" style="cursor: pointer;">
        [ IMPORT JSON ]
        <input type="file" id="import-json-file" accept=".json" style="display: none;" onchange="importConfigJson(event)">
      </label>
      <button class="toolbar__btn toolbar__btn--danger" onclick="resetToDefaults()">[ RESET DEFAULTS ]</button>
    </div>
  </div>

  <!-- Constructor Workspace -->
  <main class="generator">
    <div class="editor" id="editor-list">
      <!-- Panel editors rendered dynamically -->
    </div>
    <div class="preview">
      <div class="preview__header">
        <span class="preview__label">Live Canvas Preview</span>
        <span class="preview__tag" id="preview-mode-tag">[ 320px // 2X RETINA ]</span>
      </div>
      <div id="preview-list">
        <!-- Live canvases rendered here -->
      </div>
    </div>
  </main>

  <!-- Floating Action Dock -->
  <div class="action-dock" id="action-dock">
    <button class="action-dock__btn action-dock__btn--primary" onclick="downloadAll()">
      ↓ DOWNLOAD ALL PNG (<span id="dock-panel-count">0</span>)
    </button>
    <button class="action-dock__btn" onclick="openMarkdownModal()">
      MD ⎘ COPY TWITCH MARKDOWN
    </button>
  </div>

  <!-- Markdown Modal -->
  <div class="modal-overlay" id="markdown-modal">
    <div class="modal-box">
      <div class="modal-box__header">
        <div class="modal-box__title">TWITCH CHANNEL MARKDOWN BUNDLE</div>
        <button class="panel-editor__btn" onclick="closeMarkdownModal()">✕ CLOSE</button>
      </div>
      <p style="font-size: 11px; color: #7E8B96; margin-bottom: 12px; line-height: 1.5;">
        Paste this Markdown into the description box under each corresponding Twitch panel.
      </p>
      <textarea class="modal-box__textarea" id="markdown-bundle-text" readonly></textarea>
      <div class="modal-box__footer">
        <button class="action-dock__btn" onclick="downloadMarkdownFile()">↓ SAVE .MD FILE</button>
        <button class="action-dock__btn action-dock__btn--primary" onclick="copyMarkdownBundle()">⎘ COPY TO CLIPBOARD</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- External modular script -->
  <script src="panels.js"></script>
</body>
</html>
