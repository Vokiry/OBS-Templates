<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — intro</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/typography.css">
  <link rel="stylesheet" href="scenes.css">
  <link rel="stylesheet" href="../components/background.css">
  <link rel="stylesheet" href="../components/scene-indicator.css">
  <link rel="stylesheet" href="../components/now-playing.css">
  <link rel="stylesheet" href="../components/activity-pulse.css">
  <link rel="stylesheet" href="intro.css">
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="bg-label">now playing</div>
    <div class="hud"></div>

    <div class="ui ui--tl">
      <span class="scene-indicator" data-state="intro">
        <span class="scene-indicator__dot"></span>
        <span class="scene-indicator__value">INTRO / NOW PLAYING</span>
      </span>
    </div>

    <div class="ui ui--tr">
      <span class="activity-pulse">
        <span class="activity-pulse__dot"></span>
        <span class="activity-pulse__line"></span>
        system online
      </span>
    </div>

    <div class="intro-center">
      <div class="now-playing" data-variant="expanded">
        <div class="now-playing__cover" data-label="cover"></div>
        <div class="now-playing__meta">
          <span class="now-playing__title">Neon Terminal</span>
          <span class="now-playing__artist">Vokiry</span>
          <span class="now-playing__album">Protocol EP</span>
          <div class="now-playing__row">
            <span>00:47</span>
            <span>03:48</span>
          </div>
          <div class="now-playing__progress">
            <div class="now-playing__progress-bar" style="width: 21%"></div>
          </div>
        </div>
      </div>

      <div class="lyrics">
        <div class="lyrics__line">synthetic morning light</div>
        <div class="lyrics__line is-active">fading through the window</div>
        <div class="lyrics__line">while the city hums below</div>
        <div class="lyrics__line">waiting for a signal</div>
        <div class="lyrics__line">a spark behind the static</div>
      </div>
    </div>
  </div>
</body>
</html>
