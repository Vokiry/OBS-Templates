<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM — starting</title>
  <link rel="stylesheet" href="../base/fonts.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../base/reset.css">
  <link rel="stylesheet" href="../base/typography.css">
  <link rel="stylesheet" href="scenes.css">
  <link rel="stylesheet" href="../components/background.css">
  <link rel="stylesheet" href="../components/scene-indicator.css">
  <link rel="stylesheet" href="../components/now-playing.css">
  <link rel="stylesheet" href="../components/countdown.css">
  <link rel="stylesheet" href="../components/activity-pulse.css">
  <link rel="stylesheet" href="../components/chat.css">
  <link rel="stylesheet" href="starting.css">
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="hud"></div>

    <!-- Left Column (~50% width): Status, Hero Countdown, Streamer Content Slot, Player -->
    <div class="starting-left">
      <div class="starting-left__header">
        <span class="scene-indicator" data-state="starting">
          <span class="scene-indicator__dot"></span>
          <span class="scene-indicator__value">STARTING SOON</span>
        </span>

        <span class="activity-pulse">
          <span class="activity-pulse__dot"></span>
          <span class="activity-pulse__line"></span>
          holding
        </span>
      </div>

      <div class="starting-timer">
        <div class="countdown">
          <span class="countdown__value">10:00</span>
          <span class="countdown__label">t-minus</span>
        </div>
        <span class="mono text-xs text-muted">[ SYSTEM STANDBY ]</span>
      </div>

      <!-- Free workspace for streamer's cam / VTuber / art / clip -->
      <div class="streamer-slot" data-label="[ STREAMER WORKSPACE // CAM / ART / VTUBER ]"></div>

      <div class="now-playing">
        <div class="now-playing__cover"></div>
        <div class="now-playing__meta">
          <span class="now-playing__title">Neon Terminal</span>
          <span class="now-playing__artist">Vokiry</span>
          <div class="now-playing__progress">
            <div class="now-playing__progress-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column (~50% width): Expanded Full-Height Chat -->
    <div class="starting-right">
      <div class="chat">
        <div class="chat__header">chat // pre-stream lobby</div>
        <div class="chat__body">
          <div class="chat__msg">
            <span class="chat__user">alice</span>
            <div class="chat__content">
              <span class="chat__text">hi everyone! ready for today's stream</span>
            </div>
          </div>
          <div class="chat__msg">
            <span class="chat__user">bob</span>
            <div class="chat__content">
              <span class="chat__text">good morning stream, that intro track slaps</span>
            </div>
          </div>
          <div class="chat__msg">
            <span class="chat__user">carol</span>
            <div class="chat__content">
              <span class="chat__text">what are we playing today?</span>
            </div>
          </div>
          <div class="chat__msg">
            <span class="chat__user">dave</span>
            <div class="chat__content">
              <span class="chat__text">system24 aesthetic looks super clean</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../components/countdown.js"></script>
</body>
</html>
